/* ---------- SPORCU KAYDI / DEĞİŞİKLİĞİ (yönetici doğrudan, antrenör onaya) ---------- */
const ATH_LEVELS=['Başlangıç','Orta','İleri','Yarışmacı','Yetişkin'];
const LICENSES=['Yok','Başvuru','Aktif','Vizesiz','Süresi dolmuş'];
const TRIAL_SOURCES=['Instagram','Facebook / Sosyal medya','Google / Web sitesi','Arkadaş / Çevre tavsiyesi','Okul / Etkinlik','Tabela / Çevreden geçerken','Mevcut üyenin yakını','Diğer'];
const LEAVE_CATS=['Ücret','Verimsizlik / Gelişim','Fiziki şartlar','Antrenör','Program / Zaman','Sağlık','Taşınma','Başka kulüp','Diğer'];
const ATH_FIELDS=['first','last','dob','gender','level','group','phone','license','status'];
const ATH_LABELS={first:'Ad',last:'Soyad',dob:'Doğum tarihi',gender:'Cinsiyet',level:'Seviye',group:'Grup',phone:'Telefon',license:'Lisans',status:'Durum',leave:'Ayrılış sebebi'};
function canAddAthlete(){return role==='admin'||role==='coach';}
function groupChoices(){return (role==='admin'||role==='coach')?DB.groups:[];}
function athGroupVal(a){return a.status==='trial'?'trial':a.group;}
const okDateStr=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||'')&&ymd(parseYmd(x))===x;
const NAME_RE=/^[\p{L}][\p{L} '\-]{1,29}$/u;
function normExtra(x){x=Object.assign({},x||{}); if(!x.newFirst&&!x.newLast&&x.newName){const s=splitName(x.newName); x.newFirst=s.first; x.newLast=s.last;} return x;}
function validateTrial(t){
  const e=[]; t=t||{};
  if(TRIAL_SOURCES.indexOf(t.source)<0) e.push('Bizi nereden bulduğunu seçin.');
  if(String(t.sourceNote||'').length>120) e.push('Kaynak notu en çok 120 karakter olabilir.');
  if(t.trialDate&&!okDateStr(t.trialDate)) e.push('Deneme tarihi geçersiz.');
  if(t.interest&&!DB.groups.some(g=>g.id===t.interest)) e.push('Denemek istediği grup geçersiz.');
  return e;
}
function validateLeave(l){
  const e=[];
  if(!l||LEAVE_CATS.indexOf(l.category)<0) e.push('Ayrılış sebebini seçin.');
  else if(String(l.note||'').length>200) e.push('Sebep notu en çok 200 karakter olabilir.');
  return e;
}
function validateAthlete(c,editId){
  const e=[];
  if(!NAME_RE.test(String(c.first||'').trim())) e.push('Ad 2-30 karakter olmalı ve yalnızca harf içermeli.');
  if(!NAME_RE.test(String(c.last||'').trim())) e.push('Soyad 2-30 karakter olmalı ve yalnızca harf içermeli.');
  if(!okDateStr(c.dob)) e.push('Doğum tarihini girin.');
  else { const a=age(c.dob); if(parseYmd(c.dob)>new Date()||a<3||a>80) e.push('Doğum tarihi 3-80 yaş aralığında olmalı.'); }
  if(c.gender!=='E'&&c.gender!=='K') e.push('Cinsiyet seçin.');
  if(ATH_LEVELS.indexOf(c.level)<0) e.push('Seviye seçin.');
  const old=editId?DB.athletes.find(a=>a.id===editId):null;
  if(c.group==='trial'){
    if(old&&old.status!=='trial') e.push('Mevcut üyeler denemeye çevrilemez.');
    if(c.status!=='trial') e.push('Durum geçersiz.');
  } else {
    const g=DB.groups.find(x=>x.id===c.group);
    if(!g) e.push('Grup seçin.');
    else if((!old||old.group!==g.id)&&g.enrolled>=g.capacity) e.push(`"${g.name}" grubu dolu (${g.enrolled}/${g.capacity}).`);
    if(c.status!=='active'&&c.status!=='passive') e.push('Durum seçin.');
  }
  const ph=String(c.phone||'').trim();
  if(ph&&ph!=='-'&&!/^[0-9 +()\-]{7,20}$/.test(ph)) e.push('Telefon numarası geçersiz.');
  if(LICENSES.indexOf(c.license)<0) e.push('Lisans durumu seçin.');
  return e;
}
function validateParentExtra(x,allowExisting){
  const e=[]; x=normExtra(x);
  if(x.existing){ if(!allowExisting||!DB.parents.some(p=>p.id===x.existing)) e.push('Seçilen veli bulunamadı.'); }
  else if(x.newFirst||x.newLast||x.newPhone){
    if(!NAME_RE.test(String(x.newFirst||'').trim())) e.push('Veli adı 2-30 karakter olmalı ve yalnızca harf içermeli.');
    if(!NAME_RE.test(String(x.newLast||'').trim())) e.push('Veli soyadı 2-30 karakter olmalı ve yalnızca harf içermeli.');
    if(!/^[0-9 +()\-]{7,20}$/.test(String(x.newPhone||'').trim())) e.push('Veli telefonu geçersiz.');
  }
  return e;
}
function cleanTrial(t){t=t||{}; return {source:t.source,sourceNote:String(t.sourceNote||'').trim(),trialDate:t.trialDate||'',interest:t.interest||''};}
function cleanLeave(l,by){return {category:l.category,note:String(l.note||'').trim(),date:todayStr(),by:by||{role:'admin',id:''}};}
function applyAthleteAdd(c,extra){
  extra=normExtra(extra); const isTrial=c.group==='trial';
  let e=validateAthlete(c,null).concat(validateParentExtra(extra,true));
  if(isTrial) e=e.concat(validateTrial(extra.trial));
  if(c.status==='passive') e=e.concat(validateLeave(extra.leave));
  if(e.length) return {ok:false,errors:e};
  const g=isTrial?null:DB.groups.find(x=>x.id===c.group);
  const t=isTrial?cleanTrial(extra.trial):null;
  const ig=t&&t.interest?DB.groups.find(x=>x.id===t.interest):null;
  const coach=isTrial?((extra.byCoach&&DB.coaches.some(x=>x.id===extra.byCoach))?extra.byCoach:(ig?ig.coach:'')):g.coach;
  const id='a'+Date.now()+Math.floor(Math.random()*1000); const fn=c.first.trim(), ln=c.last.trim(); const nm=fn+' '+ln;
  const a={id,name:nm,first:fn,last:ln,dob:c.dob,gender:c.gender,level:c.level,group:isTrial?'':g.id,coach,parents:[],phone:String(c.phone||'').trim()||'-',license:c.license,balance:0,attendance:1,status:c.status,photo:initials(nm),joined:todayStr(),attTrend:[1]};
  if(isTrial) a.trial=Object.assign(t,{createdAt:todayStr(),convertedAt:null,convertedGroup:null,evaluation:'',evaluatedAt:null});
  if(c.status==='passive') a.leave=cleanLeave(extra.leave,extra.by);
  if(extra.existing){const p=DB.parents.find(x=>x.id===extra.existing); p.children.push(id); a.parents=[p.id];}
  else if(extra.newFirst){const pid='p'+Date.now()+Math.floor(Math.random()*1000); DB.parents.push({id:pid,name:extra.newFirst.trim()+' '+extra.newLast.trim(),first:extra.newFirst.trim(),last:extra.newLast.trim(),phone:extra.newPhone.trim(),email:'',relation:'Veli',children:[id]}); a.parents=[pid];}
  DB.athletes.push(a); if(g) g.enrolled++; save();
  return {ok:true,id,errors:[]};
}
function applyAthleteEdit(id,changes,by){
  const a=DB.athletes.find(x=>x.id===id); if(!a) return {ok:false,errors:['Sporcu bulunamadı.']};
  const wasTrial=a.status==='trial', wasPassive=a.status==='passive';
  const merged={}; ATH_FIELDS.forEach(f=>{merged[f]=(f in changes)?changes[f]:(f==='group'?athGroupVal(a):a[f]);});
  let e=validateAthlete(merged,id);
  if(merged.status==='passive'&&!wasPassive) e=e.concat(validateLeave(changes.leave));
  if(e.length) return {ok:false,errors:e};
  const toTrial=merged.group==='trial';
  if(!toTrial&&merged.group!==a.group){
    const og=DB.groups.find(x=>x.id===a.group), ng=DB.groups.find(x=>x.id===merged.group);
    if(og) og.enrolled=Math.max(0,og.enrolled-1);
    ng.enrolled++; a.group=ng.id; a.coach=ng.coach;
  }
  if(wasTrial&&!toTrial&&a.trial){ a.trial.convertedAt=todayStr(); a.trial.convertedGroup=merged.group; a.joined=todayStr(); }
  ATH_FIELDS.forEach(f=>{ if(f!=='group'&&f in changes) a[f]=(f==='first'||f==='last'||f==='phone')?(String(changes[f]).trim()||'-'):changes[f]; });
  if('first' in changes||'last' in changes){ a.name=a.first+' '+a.last; a.photo=initials(a.name); }
  if(merged.status==='passive'&&!wasPassive) a.leave=cleanLeave(changes.leave,by);
  else if(merged.status!=='passive') a.leave=null;
  save(); return {ok:true,errors:[]};
}
function cleanAth(c){if((c.first==null||c.first==='')&&c.name){c=Object.assign({},c,splitName(c.name));} const o={}; ATH_FIELDS.forEach(f=>{o[f]=c[f]==null?'':String(c[f]);}); if(o.group==='trial') o.status='trial'; return o;}
function diffAth(old,c){const d={}; ATH_FIELDS.forEach(f=>{const ov=f==='group'?athGroupVal(old):old[f]; if(String(ov==null?'':ov)!==String(c[f]==null?'':c[f])) d[f]=c[f];}); return d;}
/* Tek giriş noktası: yönetici doğrudan uygular, antrenör onay talebi oluşturur. */
function submitAthlete(c,editId,extra){
  c=cleanAth(c); extra=normExtra(extra);
  const rid=()=>'cr'+Date.now()+Math.floor(Math.random()*1000);
  if(role==='admin'){
    const by={role:'admin',id:''};
    if(editId){
      const old=DB.athletes.find(a=>a.id===editId); if(!old) return {ok:false,errors:['Sporcu bulunamadı.']};
      const d=diffAth(old,c);
      if(d.status==='passive'&&old.status!=='passive') d.leave=extra.leave;
      if(!Object.keys(d).length) return {ok:false,errors:['Değişiklik yapmadınız.']};
      return Object.assign(applyAthleteEdit(editId,d,by),{mode:'direct'});
    }
    return Object.assign(applyAthleteAdd(c,{existing:extra.existing||'',newFirst:extra.newFirst||'',newLast:extra.newLast||'',newPhone:extra.newPhone||'',trial:extra.trial,leave:extra.leave,by}),{mode:'direct'});
  }
  if(role!=='coach') return {ok:false,errors:['Bu işlem için yetkiniz yok.']};
  const cu=DB.currentUser.coachId; DB.changeRequests=DB.changeRequests||[];
  const by={role:'coach',id:cu};
  if(editId){
    const old=DB.athletes.find(a=>a.id===editId);
    if(!old||!canViewAthlete(editId)) return {ok:false,errors:['Bu sporcu için değişiklik talep etme yetkiniz yok.']};
    if(DB.changeRequests.some(r=>r.type==='athlete_edit'&&r.athlete===editId&&r.status==='Bekliyor')) return {ok:false,errors:['Bu sporcu için bekleyen bir değişiklik talebi zaten var.']};
    const d=diffAth(old,c);
    if(d.status==='passive'&&old.status!=='passive') d.leave=extra.leave;
    if(!Object.keys(d).length) return {ok:false,errors:['Değişiklik yapmadınız.']};
    const merged={}; ATH_FIELDS.forEach(f=>{merged[f]=(f in d)?d[f]:(f==='group'?athGroupVal(old):old[f]);});
    let e=validateAthlete(merged,editId);
    if(merged.status==='passive'&&old.status!=='passive') e=e.concat(validateLeave(d.leave));
    if(e.length) return {ok:false,errors:e};
    const r={id:rid(),type:'athlete_edit',athlete:editId,payload:d,extra:null,by,status:'Bekliyor',createdAt:todayStr(),decidedAt:null,reason:''};
    DB.changeRequests.push(r); save(); return {ok:true,id:r.id,errors:[],mode:'request'};
  }
  let e=validateAthlete(c,null).concat(validateParentExtra({newFirst:extra.newFirst,newLast:extra.newLast,newPhone:extra.newPhone},false));
  if(c.group==='trial') e=e.concat(validateTrial(extra.trial));
  if(c.status==='passive') e=e.concat(validateLeave(extra.leave));
  if(e.length) return {ok:false,errors:e};
  const r={id:rid(),type:'athlete_add',athlete:null,payload:c,extra:{newFirst:extra.newFirst||'',newLast:extra.newLast||'',newPhone:extra.newPhone||'',trial:c.group==='trial'?cleanTrial(extra.trial):null,leave:c.status==='passive'?extra.leave:null,byCoach:cu},by,status:'Bekliyor',createdAt:todayStr(),decidedAt:null,reason:''};
  DB.changeRequests.push(r); save(); return {ok:true,id:r.id,errors:[],mode:'request'};
}
function decideRequest(id,approve,reason){
  if(role!=='admin') return {ok:false,errors:['Yalnızca yönetici karar verebilir.']};
  const r=(DB.changeRequests||[]).find(x=>x.id===id); if(!r) return {ok:false,errors:['Talep bulunamadı.']};
  if(r.status!=='Bekliyor') return {ok:false,errors:['Bu talep zaten sonuçlandı.']};
  if(approve){
    const res=r.type==='athlete_add'?applyAthleteAdd(r.payload,Object.assign({},r.extra,{by:r.by})):applyAthleteEdit(r.athlete,r.payload,r.by);
    if(!res.ok) return {ok:false,errors:res.errors};
    r.status='Onaylandı';
  } else r.status='Reddedildi';
  r.decidedAt=todayStr(); r.reason=String(reason||'').slice(0,200);
  save(); return {ok:true,errors:[]};
}
function visibleRequests(){
  const L=DB.changeRequests||[];
  if(role==='admin') return L;
  if(role==='coach') return L.filter(r=>r.by.role==='coach'&&r.by.id===DB.currentUser.coachId);
  return [];
}
function pendingCount(){return role==='admin'?(DB.changeRequests||[]).filter(r=>r.status==='Bekliyor').length:0;}
function unevalCount(){return role==='admin'?DB.athletes.filter(a=>a.trial&&a.trial.convertedAt&&!a.trial.evaluatedAt).length:0;}
function navBadge(id){return id==='approvals'?pendingCount():id==='insights'?unevalCount():0;}

/* ---- deneme bilgisi / ayrılış sebebi / değerlendirme ---- */
function setTrialInfo(id,t){
  if(role!=='admin') return {ok:false,errors:['Bu işlem için yetkiniz yok.']};
  const a=DB.athletes.find(x=>x.id===id); if(!a||!a.trial) return {ok:false,errors:['Deneme kaydı bulunamadı.']};
  const e=validateTrial(t); if(e.length) return {ok:false,errors:e};
  Object.assign(a.trial,cleanTrial(t)); save(); return {ok:true,errors:[]};
}
function setTrialEvaluation(id,text){
  if(role!=='admin') return {ok:false,errors:['Bu işlem için yetkiniz yok.']};
  const a=DB.athletes.find(x=>x.id===id); if(!a||!a.trial||!a.trial.convertedAt) return {ok:false,errors:['Dönüşüm kaydı bulunamadı.']};
  text=String(text||'').trim(); if(text.length>300) return {ok:false,errors:['Değerlendirme en çok 300 karakter olabilir.']};
  a.trial.evaluation=text; a.trial.evaluatedAt=todayStr(); save(); return {ok:true,errors:[]};
}
function setLeaveReason(id,l){
  const a=DB.athletes.find(x=>x.id===id); if(!a) return {ok:false,errors:['Sporcu bulunamadı.']};
  if(!(role==='admin'||(role==='coach'&&canViewAthlete(id)&&!a.leave))) return {ok:false,errors:['Bu işlem için yetkiniz yok.']};
  if(a.status!=='passive') return {ok:false,errors:['Sebep yalnızca devam etmeyen (pasif) sporcular için girilir.']};
  const e=validateLeave(l); if(e.length) return {ok:false,errors:e};
  a.leave=cleanLeave(l,role==='admin'?{role:'admin',id:''}:{role:'coach',id:DB.currentUser.coachId}); save(); return {ok:true,errors:[]};
}
function saveReasonNote(cat,text){
  if(role!=='admin') return {ok:false,errors:['Bu işlem için yetkiniz yok.']};
  if(LEAVE_CATS.indexOf(cat)<0) return {ok:false,errors:['Geçersiz sebep.']};
  text=String(text||'').trim(); if(text.length>300) return {ok:false,errors:['Not en çok 300 karakter olabilir.']};
  DB.reasonNotes=DB.reasonNotes||{}; DB.reasonNotes[cat]=text; save(); return {ok:true,errors:[]};
}
function trialStats(){
  const L=DB.athletes.filter(a=>a.trial); const by={};
  TRIAL_SOURCES.forEach(s=>{by[s]={trials:0,conv:0};});
  L.forEach(a=>{const s=by[a.trial.source]||(by[a.trial.source]={trials:0,conv:0}); s.trials++; if(a.trial.convertedAt) s.conv++;});
  const conv=L.filter(a=>a.trial.convertedAt);
  const days=conv.map(a=>Math.max(0,Math.round((parseYmd(a.trial.convertedAt)-parseYmd(a.trial.createdAt))/86400000)));
  return {total:L.length,conv:conv.length,open:L.filter(a=>a.status==='trial').length,rate:L.length?conv.length/L.length:0,avgDays:days.length?days.reduce((x,y)=>x+y,0)/days.length:0,by,pendingEval:conv.filter(a=>!a.trial.evaluatedAt).length};
}
function leaveStats(){
  const P=DB.athletes.filter(a=>a.status==='passive'); const withR=P.filter(a=>a.leave);
  const cats={}; LEAVE_CATS.forEach(c=>{cats[c]=0;}); withR.forEach(a=>{cats[a.leave.category]=(cats[a.leave.category]||0)+1;});
  const byCoach={}; withR.forEach(a=>{const k=a.coach||'-'; (byCoach[k]=byCoach[k]||{}); byCoach[k][a.leave.category]=(byCoach[k][a.leave.category]||0)+1;});
  return {passive:P.length,reasoned:withR.length,missing:P.filter(a=>!a.leave),cats,byCoach};
}

function validatePool(p,oldName){
  const e=[]; const name=String(p.name||'').trim(); const lanes=Number(p.lanes);
  if(!/^[\p{L}\p{N} .\-]{2,30}$/u.test(name)) e.push('Havuz adı 2-30 karakter olmalı ve özel karakter içermemeli.');
  else if(DB.pools.some(x=>x.name!==oldName&&x.name.toLocaleLowerCase('tr')===name.toLocaleLowerCase('tr'))) e.push('Bu adda bir havuz zaten var.');
  if(!(Number.isInteger(lanes)&&lanes>=0&&lanes<=12)) e.push('Kulvar sayısı 0 ile 12 arasında olmalı.');
  else if(oldName){
    const old=DB.pools.find(x=>x.name===oldName); const used=DB.groups.filter(g=>g.pool===oldName);
    if(old&&used.length){
      const maxLane=Math.max(0,...used.flatMap(g=>laneList(g.lane)));
      if(old.lanes>0&&lanes===0) e.push('Bu havuzu kullanan gruplar kulvar kullanıyor; kulvar sayısı 0 yapılamaz.');
      else if(old.lanes===0&&lanes>0) e.push('Bu havuzu kullanan gruplar kulvarsız; kulvar eklemek için yeni havuz oluşturup grupları taşıyın.');
      else if(lanes>0&&maxLane>lanes) e.push(`Gruplar ${maxLane}. kulvarı kullanıyor; kulvar sayısı en az ${maxLane} olmalı.`);
    }
  }
  return e;
}
function savePool(oldName,p){
  if(!canManageGroups()) return {ok:false,errors:['Bu işlem için yetkiniz yok.']};
  if(oldName&&!DB.pools.some(x=>x.name===oldName)) return {ok:false,errors:['Havuz bulunamadı.']};
  const e=validatePool(p,oldName||null); if(e.length) return {ok:false,errors:e};
  const name=String(p.name).trim(), lanes=Number(p.lanes);
  if(oldName){
    const pool=DB.pools.find(x=>x.name===oldName); pool.name=name; pool.lanes=lanes;
    DB.groups.forEach(g=>{if(g.pool===oldName) g.pool=name;});
    if(oldName!==name) renamePoolRefs(oldName,name);
    if(window.__grpSnap&&window.__grpSnap.cfg.pool===oldName) window.__grpSnap.cfg.pool=name;
  } else DB.pools.push({name,lanes,laneCapacity:1});
  save(); return {ok:true,errors:[]};
}
function renamePoolRefs(a,b){
  const fix=arr=>(arr||[]).forEach(x=>{if(x.pool===a) x.pool=b;});
  fix(DB.rentals); fix(DB.plPackages); fix(DB.expenses); fix(DB.extraSessions); fix(DB.payments);
  if(DB.poolPrices&&DB.poolPrices[a]){DB.poolPrices[b]=DB.poolPrices[a]; delete DB.poolPrices[a];}
  Object.keys(DB.coachRates||{}).forEach(cid=>{const r=DB.coachRates[cid]; if(r&&r[a]){r[b]=r[a]; delete r[a];}});
}
function poolRefCount(name){
  const n=arr=>(arr||[]).filter(x=>x.pool===name).length;
  return {rentals:n(DB.rentals),packages:n(DB.plPackages),expenses:n(DB.expenses),extra:n(DB.extraSessions),payments:n(DB.payments)};
}
function removePool(name){
  if(!canManageGroups()) return {ok:false,errors:['Bu işlem için yetkiniz yok.']};
  const pool=DB.pools.find(x=>x.name===name); if(!pool) return {ok:false,errors:['Havuz bulunamadı.']};
  const used=DB.groups.filter(g=>g.pool===name);
  if(used.length) return {ok:false,errors:[`${name} havuzunu ${used.length} grup kullanıyor. Önce grupları başka havuza taşıyın.`]};
  if(DB.pools.length<=1) return {ok:false,errors:['Son havuz silinemez.']};
  const rc=poolRefCount(name), parts=[]; if(rc.rentals) parts.push(rc.rentals+' kiralama'); if(rc.packages) parts.push(rc.packages+' özel ders paketi'); if(rc.expenses) parts.push(rc.expenses+' gider'); if(rc.extra) parts.push(rc.extra+' ek ders kaydı'); if(rc.payments) parts.push(rc.payments+' ödeme');
  if(parts.length) return {ok:false,errors:[`${name} havuzuna bağlı kayıtlar var (${parts.join(', ')}); finans kayıtları bozulmaması için silinemez.`]};
  DB.pools=DB.pools.filter(x=>x.name!==name);
  if(DB.poolPrices) delete DB.poolPrices[name];
  Object.keys(DB.coachRates||{}).forEach(cid=>{if(DB.coachRates[cid]) delete DB.coachRates[cid][name];});
  if(window.__grpSnap&&window.__grpSnap.cfg.pool===name){window.__grpSnap.cfg.pool='';window.__grpSnap.cfg.lanes=[];}
  save(); return {ok:true,errors:[]};
}

function okYm(s){return /^\d{4}-(0[1-9]|1[0-2])$/.test(s||'');}
function monthLabel(ym){const p=ym.split('-'); return MONTHS_TR[+p[1]-1]+' '+p[0];}
function monthDays(ym){const p=ym.split('-').map(Number); const n=new Date(p[0],p[1],0).getDate(); return Array.from({length:n},(_,i)=>ym+'-'+String(i+1).padStart(2,'0'));}
function prevYm(ym){const p=ym.split('-').map(Number); const d=new Date(p[0],p[1]-2,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function curYm(){return ymd(new Date()).slice(0,7);}
function amt(x){const n=Number(String(x).replace(',','.')); return n;}
function okAmt(n,max){return Number.isFinite(n)&&n>0&&n<=(max||10000000);}
function okAmt0(n,max){return Number.isFinite(n)&&n>=0&&n<=(max||100000);}
function r2(n){return Math.round(n*100)/100;}

/* ---------- ÖDEMELER (yalnızca yönetici girer/değiştirir) ---------- */
function validatePayment(c){
  const e=[]; const a=Number(String(c.amount).replace(',','.'));
  if(!DB.athletes.some(x=>x.id===c.athlete)) e.push('Sporcu seçin.');
  if(!okAmt(a,1000000)) e.push('Tutar 0’dan büyük ve en çok 1.000.000 ₺ olmalı.');
  if(!okDateS(c.due)) e.push('Vade tarihini girin.');
  if(PAY_TYPES.indexOf(c.type)<0) e.push('Ödeme türünü seçin.');
  if(['paid','pending','overdue'].indexOf(c.status)<0) e.push('Durum seçin.');
  if(PAY_METHODS.indexOf(c.method)<0) e.push('Ödeme yöntemini seçin.');
  if(c.pool!==undefined&&c.pool!=='__auto'&&c.pool!==''&&!poolExists(c.pool)) e.push('Havuz geçersiz.');
  if(c.status==='paid'&&c.paidDate&&!okDateS(c.paidDate)) e.push('Ödeme tarihi geçersiz.');
  return e;
}
function savePayment(c,editId){
  if(role!=='admin') return {ok:false,errors:['Ödemeleri yalnızca yönetici girebilir veya değiştirebilir.']};
  const old=editId?DB.payments.find(p=>p.id===editId):null; if(editId&&!old) return {ok:false,errors:['Ödeme bulunamadı.']};
  const e=validatePayment(c); if(e.length) return {ok:false,errors:e};
  const paid=c.status==='paid';
  const rec={athlete:c.athlete,amount:r2(Number(String(c.amount).replace(',','.'))),due:c.due,status:c.status,type:c.type,method:paid?(c.method==='-'?'Elden/Manuel':c.method):'-',paidDate:paid?(c.paidDate||todayStr()):'',pool:resolvePayPool(c,old)};
  let id; if(old){Object.assign(old,rec); id=old.id;} else {id='pay'+Date.now()+Math.floor(Math.random()*1000); DB.payments.push(Object.assign({id},rec));}
  recalcBalances(); save(); return {ok:true,id,errors:[]};
}
function removePayment(id){
  if(role!=='admin') return {ok:false,errors:['Yalnızca yönetici silebilir.']};
  const p=DB.payments.find(x=>x.id===id); if(!p) return {ok:false,errors:['Ödeme bulunamadı.']};
  DB.payments=DB.payments.filter(x=>x.id!==id); recalcBalances(); save(); return {ok:true,errors:[]};
}
function markPaid(id){
  if(role!=='admin') return;
  const p=DB.payments.find(x=>x.id===id); if(!p) return;
  savePayment({athlete:p.athlete,amount:p.amount,due:p.due,status:'paid',type:p.type||'Aidat',method:'Elden/Manuel',paidDate:todayStr(),pool:payPool(p)},id); render();
}
function recalcBalances(){DB.athletes.forEach(a=>{a.balance=DB.payments.filter(p=>p.athlete===a.id&&(p.status==='overdue'))./*gecikmiş*/reduce((s,p)=>s+p.amount,0);});}

function pkgRemaining(pk){return pk.hours-pkgUsed(pk);}
function athletePackages(id){return (DB.plPackages||[]).filter(p=>p.athlete===id).sort((x,y)=>x.createdAt.localeCompare(y.createdAt)||x.id.localeCompare(y.id));}
function pickPackage(id){return athletePackages(id).find(p=>pkgRemaining(p)>0)||null;}

function pkgPriceFor(pool,hours){return r2(Number(hours)*poolPrice(pool,'private'));}

/* ---------- ANTRENÖR DERS ÜCRETLERİ (havuza göre ayrı) ---------- */
const RATE_TYPES=[['group','Grup dersi'],['private','Özel ders'],['other','Diğer antrenman']];
const INC_ITEMS=[['Aidat','Aidat tahsilatı'],['Özel ders paketi','Özel ders paketi satışı'],['Diğer','Diğer tahsilat'],['Havuz kiralama','Havuz kiralama (tahsil edilen)']];
const EXP_ITEMS=RATE_TYPES.map(t=>['coach:'+t[0],'Antrenör ücreti – '+t[1]]).concat(EXP_CATS.map(c=>['cat:'+c,c]));
function rateOf(cid,t,pool){const r=((((DB.coachRates||{})[cid])||{})[pool])||{}; return Number(r[t])||0;}
function saveCoachRates(cid,pool,r){
  if(role!=='admin') return {ok:false,errors:['Ücretleri yalnızca yönetici girebilir.']};

  RATE_TYPES.forEach(t=>{const n=Number(String(r[t[0]]).replace(',','.')); if(!okAmt0(n)) e.push(t[1]+' ücreti 0 ile 100.000 ₺ arasında olmalı.'); else out[t[0]]=r2(n);});
  if(e.length) return {ok:false,errors:e};
  DB.coachRates=DB.coachRates||{}; DB.coachRates[cid]=DB.coachRates[cid]||{}; DB.coachRates[cid][pool]=out; save(); return {ok:true,errors:[]};

function addExtraSession(c){

  if(!(Number.isInteger(cnt)&&cnt>=1&&cnt<=60)) e.push('Ders adedi 1 ile 60 arasında olmalı.');
  if(e.length) return {ok:false,errors:e};

function removeExtraSession(id){ if(role!=='admin') return {ok:false,errors:['Yalnızca yönetici silebilir.']}; DB.extraSessions=(DB.extraSessions||[]).filter(x=>x.id!==id); save(); return {ok:true,errors:[]}; }
function groupSessionsInMonth(g,ym){return monthDays(ym).filter(ds=>groupOnDay(g,ds)).length;}
/* Özel dersin havuzu = dersin düştüğü paketin havuzu */
function lessonPool(pl){const pk=(DB.plPackages||[]).find(x=>x.id===pl.pkg); return pk&&pk.pool?pk.pool:((DB.pools[0]&&DB.pools[0].name)||'');}
/* pool: boş (undefined/null) = tüm havuzlar; aksi halde yalnızca o havuz. byPool her zaman havuz kırılımını verir. */
function coachPayFor(cid,ym,pool){
  if(pool===undefined) pool=null;
  const per={}; DB.pools.forEach(p=>{per[p.name]={groupCount:0,privateCount:0,otherCount:0};});
  const bump=(pn,k,n)=>{ if(per[pn]) per[pn][k]+=n; };
  DB.groups.filter(g=>g.coach===cid).forEach(g=>bump(g.pool,'groupCount',groupSessionsInMonth(g,ym)));
  (DB.privateLessons||[]).filter(p=>p.coach===cid&&p.status==='Onaylandı'&&ymOf(p.date)===ym).forEach(p=>bump(lessonPool(p),'privateCount',1));
  (DB.extraSessions||[]).filter(x=>x.coach===cid&&ymOf(x.date)===ym).forEach(x=>bump(x.pool,'otherCount',x.count));
  const byPool={}; let gc=0,pc=0,oc=0,ga=0,pa=0,oa=0;
  Object.keys(per).forEach(pn=>{
    if(pool!==null&&pn!==pool) return; const x=per[pn];
    const a=r2(x.groupCount*rateOf(cid,'group',pn)), b=r2(x.privateCount*rateOf(cid,'private',pn)), c=r2(x.otherCount*rateOf(cid,'other',pn));
    byPool[pn]=Object.assign({},x,{groupAmt:a,privateAmt:b,otherAmt:c,total:r2(a+b+c)});
    gc+=x.groupCount; pc+=x.privateCount; oc+=x.otherCount; ga+=a; pa+=b; oa+=c;
  });
  ga=r2(ga); pa=r2(pa); oa=r2(oa);
  return {coach:cid,name:coachName(cid),groupCount:gc,privateCount:pc,otherCount:oc,groupAmt:ga,privateAmt:pa,otherAmt:oa,total:r2(ga+pa+oa),byPool};
}

/* ---------- HAVUZ KİRALAMA ---------- */
function rentalDows(r){return new Set((r.days||[]).map(d=>DAYTOKEN[d]).filter(x=>x!==undefined));}
function anyShare(a,b){for(const x of a) if(b.has(x)) return true; return false;}
function rentalDates(r,ym){
  const dw=rentalDows(r);
  return monthDays(ym).filter(ds=>(!r.startDate||ds>=r.startDate)&&(!r.endDate||ds<=r.endDate)&&dw.has(parseYmd(ds).getDay()));
}
function rentalUnits(r){const p=DB.pools.find(x=>x.name===r.pool); return p&&p.lanes>0?r.lanes:1;}
function rentalAmount(r,ym){
  const hours=(timeToMin(r.end)-timeToMin(r.start))/60;
  return r2(rentalDates(r,ym).length*hours*rentalUnits(r)*r.laneFee);
}
/* Havuzda aynı anda kullanılan kulvar sayısının zirvesi (gruplar + kiralamalar + aday) */
function poolPeak(pool,cand,ignoreId){
  const cd=cand.days;
  const gs=DB.groups.filter(g=>g.pool===pool.name&&g.id!==ignoreId&&rangesOverlap(cand,g)&&anyShare(groupDows(g),cd)).map(g=>({iv:groupMinutes(g),lanes:laneList(g.lane)}));
  const rs=(DB.rentals||[]).filter(r=>r.pool===pool.name&&r.id!==ignoreId&&rangesOverlap(cand,r)&&anyShare(rentalDows(r),cd)).map(r=>({iv:[timeToMin(r.start),timeToMin(r.end)],n:rentalUnits(r),club:r.club}));
  const pts=new Set([cand.start]); gs.forEach(x=>pts.add(x.iv[0])); rs.forEach(x=>pts.add(x.iv[0]));
  let peak=0,at=null,clubs=[];
  pts.forEach(t=>{
    if(t<cand.start||t>=cand.end) return;
    const gl=new Set(cand.kind==='group'?(cand.lanes||[]):[]); let gcount=cand.kind==='group'?1:0;
    gs.forEach(x=>{ if(x.iv[0]<=t&&t<x.iv[1]){ x.lanes.forEach(l=>gl.add(l)); gcount++; } });
    let rent=cand.kind==='rental'?cand.count:0, rcount=cand.kind==='rental'?1:0; const cl=[];
    rs.forEach(x=>{ if(x.iv[0]<=t&&t<x.iv[1]){ rent+=x.n; rcount++; cl.push(x.club); } });
    const used=pool.lanes>0?gl.size+rent:(gcount+rcount);
    if(used>peak){peak=used;at=t;clubs=cl;}
  });
  const cap=pool.lanes>0?pool.lanes:1;
  return {over:peak>cap,peak,cap,at,clubs};
}
function validateRental(c,ignoreId){
  const errors=[],conflicts=[];
  const club=String(c.club||'').trim(), contact=String(c.contact||'').trim(), coach=String(c.coachName||'').trim(), ph=String(c.phone||'').trim();
  const nameRe=/^[\p{L}\p{N} .'&\-]{2,60}$/u;
  if(!nameRe.test(club)) errors.push('Kulüp adı 2-60 karakter olmalı.');
  if(!/^[\p{L} .'\-]{3,60}$/u.test(contact)) errors.push('Yetkili kişi adı soyadı 3-60 karakter olmalı.');
  if(!/^[\p{L} .'\-]{3,60}$/u.test(coach)) errors.push('Antrenör adı soyadı 3-60 karakter olmalı.');
  if(ph&&!/^[0-9 +()\-]{7,20}$/.test(ph)) errors.push('Telefon geçersiz.');
  const pool=DB.pools.find(p=>p.name===c.pool); if(!pool) errors.push('Havuz seçin.');
  const lanes=Number(c.lanes);
  if(pool){
    if(pool.lanes>0){ if(!(Number.isInteger(lanes)&&lanes>=1&&lanes<=pool.lanes)) errors.push(`Kulvar adedi 1 ile ${pool.lanes} arasında olmalı.`); }
    else if(lanes!==1&&c.lanes!==''&&c.lanes!==undefined&&Number(c.lanes)!==0) errors.push('Bu havuz kulvarsızdır; tüm havuz kiralanır.');
  }
  const days=(c.days||[]).filter(d=>GRP_DAYS.indexOf(d)>-1); if(!days.length) errors.push('En az bir gün seçin.');
  const s=timeToMin(c.start),e=timeToMin(c.end);
  if(s===null||e===null) errors.push('Başlangıç ve bitiş saatini girin.');
  else if(e<=s) errors.push('Bitiş saati başlangıçtan sonra olmalı.');
  else if(s<6*60||e>23*60) errors.push('Saatler 06:00 - 23:00 arasında olmalı.');
  else if(e-s<30||e-s>360) errors.push('Süre 30 dakika ile 6 saat arasında olmalı.');
  const fee=Number(String(c.laneFee).replace(',','.')); if(!okAmt0(fee,100000)) errors.push('Ücret 0 ile 100.000 ₺ arasında olmalı.');
  if(!okDateS(c.startDate)) errors.push('Başlangıç tarihini girin.');
  else if(c.endDate&&(!okDateS(c.endDate)||c.endDate<c.startDate)) errors.push('Bitiş tarihi başlangıçtan önce olamaz.');
  else if(!ignoreId&&c.startDate<todayStr()) errors.push('Başlangıç tarihi geçmişte olamaz.');
  if(errors.length) return {errors,conflicts};
  const cand={kind:'rental',id:ignoreId||'_new',days:new Set(days.map(d=>DAYTOKEN[d])),start:s,end:e,startDate:c.startDate,endDate:c.endDate||null,count:pool.lanes>0?lanes:1};
  const pk=poolPeak(pool,cand,ignoreId||null);
  if(pk.over) conflicts.push(pool.lanes>0?`${pool.name}: ${minToTime(pk.at)} itibarıyla ${pk.peak} kulvar gerekiyor ama havuzda ${pk.cap} kulvar var (gruplar ve diğer kiralamalar dahil${pk.clubs.length?': '+pk.clubs.join(', '):''}).`:`${pool.name} bu saatte başka bir grup veya kiralama tarafından kullanılıyor.`);
  return {errors,conflicts};
}
function saveRental(c,editId){
  if(role!=='admin') return {ok:false,errors:['Kiralama kaydını yalnızca yönetici girebilir.'],conflicts:[]};
  const old=editId?(DB.rentals||[]).find(r=>r.id===editId):null; if(editId&&!old) return {ok:false,errors:['Kayıt bulunamadı.'],conflicts:[]};

  DB.rentals=DB.rentals||[]; let id;

  save(); return {ok:true,id,errors:[],conflicts:[]};
}
function removeRental(id){ if(role!=='admin') return {ok:false,errors:['Yalnızca yönetici silebilir.']}; if(!(DB.rentals||[]).some(r=>r.id===id)) return {ok:false,errors:['Kayıt bulunamadı.']}; DB.rentals=DB.rentals.filter(r=>r.id!==id); save(); return {ok:true,errors:[]}; }
function rentalSetPaid(id,ym,paid){

/* ---------- AYLIK FİNANSAL RAPOR (havuz bazlı + tüm havuzlar) ---------- */
function poolLabel(p){return p===null?'Tüm havuzlar':(p===''?'Ortak (havuza atanmamış)':p);}
function incLabel(k){const x=INC_ITEMS.find(i=>i[0]===k); return x?x[1]:k;}
function expLabel(k){const x=EXP_ITEMS.find(i=>i[0]===k); return x?x[1]:k;}
function payPool(p){return p.pool!==undefined?p.pool:derivePayPool(p.athlete,p.pkg);}
function derivePayPool(athId,pkgId){
  const pk=pkgId?(DB.plPackages||[]).find(x=>x.id===pkgId):null; if(pk&&pk.pool) return pk.pool;
  const a=DB.athletes.find(x=>x.id===athId); const g=a?DB.groups.find(x=>x.id===a.group):null; return g?g.pool:'';
}
function resolvePayPool(c,old){
  if(c.pool===undefined) return old&&old.pool!==undefined?old.pool:derivePayPool(c.athlete,old&&old.pkg);
  if(c.pool==='__auto') return derivePayPool(c.athlete,old&&old.pkg);

}
const inScope=(pool,p)=>pool===null||p===pool;
function financeCore(ym,pool){
  if(pool===undefined) pool=null;
  const last=ym+'-'+String(monthDays(ym).length).padStart(2,'0');
  const paid=DB.payments.filter(p=>p.status==='paid'&&ymOf(p.paidDate||p.due)===ym&&inScope(pool,payPool(p)));
  const byType={}; PAY_TYPES.forEach(t=>{byType[t]=0;}); paid.forEach(p=>{const t=p.type||'Aidat'; byType[t]=r2((byType[t]||0)+p.amount);});
  const rentals=(DB.rentals||[]).filter(r=>inScope(pool,r.pool)).map(r=>({r,amount:rentalAmount(r,ym),paid:(r.paidMonths||[]).indexOf(ym)>-1,sessions:rentalDates(r,ym).length})).filter(x=>x.amount>0);
  const rentIn=r2(rentals.filter(x=>x.paid).reduce((s,x)=>s+x.amount,0)), rentRecv=r2(rentals.filter(x=>!x.paid).reduce((s,x)=>s+x.amount,0));
  const unpaid=DB.payments.filter(p=>p.status!=='paid'&&p.due<=last&&inScope(pool,payPool(p)));
  const recv=r2(unpaid.reduce((s,p)=>s+p.amount,0)), overdue=r2(unpaid.filter(p=>p.status==='overdue').reduce((s,p)=>s+p.amount,0));
  let pay=DB.coaches.map(c=>coachPayFor(c.id,ym,pool));
  if(pool!==null) pay=pay.filter(x=>x.groupCount+x.privateCount+x.otherCount>0);
  const coachBy={group:r2(pay.reduce((s,x)=>s+x.groupAmt,0)),private:r2(pay.reduce((s,x)=>s+x.privateAmt,0)),other:r2(pay.reduce((s,x)=>s+x.otherAmt,0))};
  const coachTotal=r2(coachBy.group+coachBy.private+coachBy.other);
  const exp=(DB.expenses||[]).filter(x=>ymOf(x.date)===ym&&inScope(pool,x.pool||''));
  const byCat={}; EXP_CATS.forEach(c=>{byCat[c]=0;}); exp.forEach(x=>{byCat[x.category]=r2((byCat[x.category]||0)+x.amount);});
  const expTotal=r2(exp.reduce((s,x)=>s+x.amount,0));
  const inc={}; PAY_TYPES.forEach(t=>{inc[t]=byType[t]||0;}); inc['Havuz kiralama']=rentIn;
  const ex={}; RATE_TYPES.forEach(t=>{ex['coach:'+t[0]]=coachBy[t[0]];}); EXP_CATS.forEach(c=>{ex['cat:'+c]=byCat[c]||0;});

}
function validSel(sel,items){ if(!Array.isArray(sel)) return items.map(i=>i[0]); return items.map(i=>i[0]).filter(k=>sel.indexOf(k)>-1); }
/* Seçili kalemlere göre toplamları yeniden hesaplar (kalem filtresi isteğe bağlı) */
function applySel(core,incKeys,expKeys){
  core.income=r2(incKeys.reduce((s,k)=>s+(core.inc[k]||0),0));
  core.expense=r2(expKeys.reduce((s,k)=>s+(core.exp[k]||0),0));
  core.net=r2(core.income-core.expense); return core;
}
function monthlyReport(ym,opts){
  if(role!=='admin'||!okYm(ym)) return null;
  opts=opts||{};
  const pool=(opts.pool===undefined||opts.pool===null||opts.pool==='__all')?null:opts.pool;
  if(pool!==null&&pool!==''&&!poolExists(pool)) return null;
  const incKeys=validSel(opts.inc,INC_ITEMS), expKeys=validSel(opts.exp,EXP_ITEMS);
  const filtered=incKeys.length!==INC_ITEMS.length||expKeys.length!==EXP_ITEMS.length;
  const mk=(m,p)=>applySel(financeCore(m,p),incKeys,expKeys);
  const cur=mk(ym,pool), prev=mk(prevYm(ym),pool);
  const inM=ds=>ymOf(ds)===ym;
  const inP=a=>{ if(pool===null) return true; const g=DB.groups.find(x=>x.id===a.group); return !!g&&g.pool===pool; };
  const kpi=pool===null?{
    active:DB.athletes.filter(a=>a.status==='active').length,
    newMembers:DB.athletes.filter(a=>a.status!=='trial'&&inM(a.joined)).length,
    trials:DB.athletes.filter(a=>a.trial&&inM(a.trial.createdAt)).length,
    converted:DB.athletes.filter(a=>a.trial&&a.trial.convertedAt&&inM(a.trial.convertedAt)).length,
    left:DB.athletes.filter(a=>a.leave&&inM(a.leave.date)).length,
    privateLessons:(DB.privateLessons||[]).filter(p=>p.status==='Onaylandı'&&inM(p.date)).length
  }:{
    active:DB.athletes.filter(a=>a.status==='active'&&inP(a)).length,
    privateLessons:(DB.privateLessons||[]).filter(p=>p.status==='Onaylandı'&&inM(p.date)&&lessonPool(p)===pool).length
  };
  let cols=null;
  if(pool===null){
    cols=DB.pools.map(p=>({name:p.name,label:p.name,cur:mk(ym,p.name)}));
    const o=mk(ym,''); if(o.income>0||o.expense>0||INC_ITEMS.some(i=>o.inc[i[0]]>0)||EXP_ITEMS.some(i=>o.exp[i[0]]>0)) cols.push({name:'',label:'Ortak',cur:o});
  }
  const scope=poolLabel(pool);
  const lines=[]; const pct=(a,b)=>b?Math.round((a-b)/b*100):null;
  lines.push(`${monthLabel(ym)} ayında ${scope} için toplam ${money(cur.income)} gelir ve ${money(cur.expense)} gider gerçekleşti; net sonuç ${cur.net>=0?'+':'−'}${money(Math.abs(cur.net))}.`);
  const dI=pct(cur.income,prev.income); if(dI!==null) lines.push(`Gelir önceki aya göre ${dI>=0?'%'+dI+' arttı':'%'+Math.abs(dI)+' azaldı'} (${money(prev.income)}).`);
  const top=expKeys.map(k=>[expLabel(k),cur.exp[k]||0]).sort((a,b)=>b[1]-a[1])[0];
  if(top&&top[1]>0) lines.push(`En büyük gider kalemi ${top[0]} (${money(top[1])}).`);
  if(cols&&cols.length>1){ const s=cols.slice().sort((a,b)=>b.cur.net-a.cur.net); lines.push(`Net sonuç en yüksek havuz: ${s[0].label} (${money(s[0].cur.net)}); en düşük: ${s[s.length-1].label} (${money(s[s.length-1].cur.net)}).`); }
  if(cur.recv>0) lines.push(`Tahsil edilmemiş ${money(cur.recv)} alacak var${cur.overdue>0?`; bunun ${money(cur.overdue)} tutarı gecikmiş`:''}.`);
  if(cur.rentRecv>0) lines.push(`Havuz kiralama alacağı: ${money(cur.rentRecv)}.`);
  if(pool===null) lines.push(`Aktif sporcu ${kpi.active}; yeni kayıt ${kpi.newMembers}, denemeden kayıt ${kpi.converted}, ayrılan ${kpi.left}.`);
  else lines.push(`Bu havuzdaki gruplarda aktif sporcu: ${kpi.active}; gerçekleşen özel ders: ${kpi.privateLessons} saat.`);
  if(filtered) lines.push('Not: Rapor, seçtiğiniz gelir ve gider kalemleriyle sınırlıdır; toplamlar yalnızca seçili kalemleri içerir.');
  if(ym===curYm()) lines.push('Not: Ay devam ediyor; antrenör ücretleri ve kiralama gelirleri ay sonuna kadar planlanan dersler üzerinden hesaplanmıştır.');

}

function poolSelectOptions(sel,withAll,withShared,allLabel,sharedLabel){
  return (withAll?`<option value="__all" ${sel==='__all'?'selected':''}>${escHtml(allLabel||'Tüm havuzlar')}</option>`:'')
   +DB.pools.map(p=>`<option value="${escHtml(p.name)}" ${sel===p.name?'selected':''}>${escHtml(p.name)}</option>`).join('')
   +(withShared?`<option value="" ${sel===''?'selected':''}>${escHtml(sharedLabel||'Ortak (havuza atanmamış)')}</option>`:'');
}
function finTabs(){
  const T=[['report','Aylık Rapor'],['expenses','Giderler'],['prices','Havuz Fiyatları'],['rates','Antrenör Ücretleri'],['packages','Özel Ders Paketleri']];
  return `<div class="pillbar">${T.map(t=>`<div class="p ${finTab===t[0]?'active':''}" onclick="finTab='${t[0]}';renderFinance($('#content'))">${t[1]}</div>`).join('')}</div>`;
}

    body=`<div class="card"><b>Antrenör ders ücretleri havuza göre ayrıdır</b><div style="font-size:12.5px;color:var(--muted);margin:4px 0 0;">Grup dersi: gruba atanan ana antrenör, o grubun havuzundaki her ders için. Özel ders: onaylanan her saat için, dersin düştüğü paketin havuzu esas alınır. Diğer antrenman: aşağıdan havuz seçilerek girilen ek ders için.</div><div id="rt_res" style="font-size:12.5px;margin-top:8px;"></div></div>
      ${DB.pools.map((pl,pi)=>`<div class="card" style="margin-top:14px;"><b>${escHtml(pl.name)} — ders başına ücret (₺)</b>
      <div style="overflow-x:auto;"><table style="margin-top:8px;"><thead><tr><th>Antrenör</th>${RATE_TYPES.map(t=>`<th>${t[1]}</th>`).join('')}<th></th></tr></thead><tbody>
      ${DB.coaches.map(co=>`<tr><td>${escHtml(co.name)}</td>${RATE_TYPES.map(t=>`<td><input id="rt_${pi}_${co.id}_${t[0]}" inputmode="decimal" style="width:90px;${inp}" value="${rateOf(co.id,t[0],pl.name)}"></td>`).join('')}<td><button class="btn sm primary" onclick="rateSave('${co.id}',${pi})">Kaydet</button></td></tr>`).join('')}</tbody></table></div></div>`).join('')}
      <div class="card" style="margin-top:14px;"><b>Diğer antrenman / ek ders kaydı</b><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px;">
      <div class="field" style="margin:0;"><label for="xs_coach">Antrenör</label><select id="xs_coach">${DB.coaches.map(co=>`<option value="${co.id}">${escHtml(co.name)}</option>`).join('')}</select></div>
      <div class="field" style="margin:0;"><label for="xs_pool">Havuz</label><select id="xs_pool">${poolSelectOptions('',false,false)}</select></div>
      <div class="field" style="margin:0;"><label for="xs_date">Tarih</label><input id="xs_date" type="date" value="${todayStr()}"></div>
      <div class="field" style="margin:0;"><label for="xs_label">Açıklama</label><input id="xs_label" maxlength="40" placeholder="Masters antrenmanı, kamp…"></div>
      <div class="field" style="margin:0;"><label for="xs_count">Ders adedi</label><input id="xs_count" type="number" min="1" max="60" value="1"></div></div>

      <div style="margin-top:12px;"><label for="rt_month" style="font-size:12.5px;color:var(--muted);">Ay </label><select id="rt_month" style="${inp}" onchange="finMonth=this.value;renderFinance($('#content'))">${monthOptions(finMonth)}</select></div>
      <table style="margin-top:8px;"><tbody>${exs.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${escHtml(coachName(x.coach))}</td><td>${escHtml(x.pool||'')}</td><td>${escHtml(x.label)}</td><td>${x.count} ders</td><td><button class="btn sm danger" onclick="extraDel('${x.id}')">Sil</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Bu ay ek ders kaydı yok</div></td></tr>'}</tbody></table></div>
      <div class="card" style="margin-top:14px;"><b>${monthLabel(finMonth)} — hesaplanan antrenör ücretleri (havuza göre)</b><div style="overflow-x:auto;"><table style="margin-top:8px;"><thead><tr><th>Antrenör</th><th>Havuz</th><th>Grup</th><th>Özel</th><th>Diğer</th><th>Toplam</th></tr></thead><tbody>
      ${DB.coaches.map(co=>{const x=coachPayFor(co.id,finMonth); return Object.keys(x.byPool).filter(pn=>x.byPool[pn].groupCount+x.byPool[pn].privateCount+x.byPool[pn].otherCount>0).map(pn=>{const y=x.byPool[pn]; return `<tr><td>${escHtml(co.name)}</td><td>${escHtml(pn)}</td><td>${y.groupCount} · ${money(y.groupAmt)}</td><td>${y.privateCount} · ${money(y.privateAmt)}</td><td>${y.otherCount} · ${money(y.otherAmt)}</td><td><b>${money(y.total)}</b></td></tr>`;}).join('');}).join('')||'<tr><td colspan="6"><div class="empty">Bu ay ders yok</div></td></tr>'}</tbody></table></div></div>`;
  } else {
    const pks=(DB.plPackages||[]).slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
    body=`<div class="card"><b>Sporcuya paket tanımla</b><div style="font-size:12.5px;color:var(--muted);margin:4px 0 8px;">Paketler hazırdır: 6, 8, 10 veya 20 saat. Fiyat, seçilen havuzun özel ders saat ücretinden hesaplanır (Havuz Fiyatları sekmesi). Serbest ders adedi girilemez.</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;">
      <div class="field" style="margin:0;"><label for="pk_ath">Sporcu</label><select id="pk_ath"><option value="">Seçin</option>${DB.athletes.filter(a=>a.status==='active').map(a=>`<option value="${a.id}">${escHtml(a.name)}</option>`).join('')}</select></div>
      <div class="field" style="margin:0;"><label for="pk_pool">Havuz</label><select id="pk_pool" onchange="pkgPoolChanged()">${poolSelectOptions('',false,false)}</select></div>

      <label class="chk" style="margin-top:10px;display:inline-flex;"><input type="checkbox" id="pk_pay" checked> Ödeme kaydı da oluştur (bekliyor)</label>
      <div id="pk_res" style="font-size:12.5px;color:var(--red);margin-top:6px;"></div><button class="btn primary" style="margin-top:8px;" onclick="pkgSell()">Paketi tanımla</button></div>
      <div class="card" style="padding:0;margin-top:14px;overflow-x:auto;"><table><thead><tr><th>Sporcu</th><th>Havuz</th><th>Paket</th><th>Kalan</th><th>Fiyat</th><th>Tarih</th><th></th></tr></thead><tbody>
      ${pks.map(pk=>`<tr><td>${escHtml(athleteName(pk.athlete))}</td><td>${escHtml(pk.pool||'—')}</td><td>${pk.hours} saat</td><td>${pkgRemaining(pk)} saat</td><td>${money(pk.price)}</td><td>${fmtDate(pk.createdAt)}</td><td><button class="btn sm danger" onclick="pkgDel('${pk.id}')">Sil</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">Henüz paket tanımlanmadı</div></td></tr>'}</tbody></table></div>`;
  }

function pkgPoolChanged(){
  const ps=document.getElementById('pk_pool'), hs=document.getElementById('pk_h'); if(!ps||!hs) return;
  const prev=hs.value; hs.innerHTML=PKG_SIZES.map(h=>{const pr=pkgPriceFor(ps.value,h); return `<option value="${h}">${h} saatlik paket${pr?' — '+money(pr):' — fiyat girilmemiş'}</option>`;}).join(''); if(prev) hs.value=prev;
}
function expAdd(){const v=id=>document.getElementById(id).value; const r=saveExpense({date:v('ex_date'),pool:v('ex_pool'),category:v('ex_cat'),amount:v('ex_amt'),desc:v('ex_desc')}); if(!r.ok){document.getElementById('ex_res').textContent=r.errors.join(' ');return;} finMonth=ymOf(v('ex_date')); finMsg='Gider kaydedildi.'; renderFinance($('#content'));}
function expDel(id){if(!confirm('Gider silinsin mi?'))return; removeExpense(id); renderFinance($('#content'));}
function rateSave(cid,pi){const pl=DB.pools[pi]; const el=document.getElementById('rt_res'); if(!pl) return; const o={}; RATE_TYPES.forEach(t=>{o[t[0]]=document.getElementById('rt_'+pi+'_'+cid+'_'+t[0]).value;}); const r=saveCoachRates(cid,pl.name,o); if(!r.ok){el.style.color='var(--red)'; el.textContent=r.errors.join(' '); return;} finMsg=coachName(cid)+' — '+pl.name+' ücretleri kaydedildi.'; renderFinance($('#content'));}
function extraAdd(){const v=id=>document.getElementById(id).value; const r=addExtraSession({coach:v('xs_coach'),pool:v('xs_pool'),date:v('xs_date'),label:v('xs_label'),count:v('xs_count')}); if(!r.ok){document.getElementById('xs_res').textContent=r.errors.join(' ');return;} finMonth=ymOf(v('xs_date')); finMsg='Kayıt eklendi.'; renderFinance($('#content'));}
function extraDel(id){removeExtraSession(id); renderFinance($('#content'));}
function priceSave(pi){const pl=DB.pools[pi]; if(!pl) return; const r=savePoolPrices(pl.name,{group:document.getElementById('hp_g'+pi).value,private:document.getElementById('hp_p'+pi).value}); const el=document.getElementById('pp_res'); if(r.ok){finMsg=pl.name+' fiyatları kaydedildi.'; renderFinance($('#content')); return;} el.style.color='var(--red)'; el.textContent=pl.name+': '+r.errors.join(' ');}
function pkgSell(){const r=sellPackage(document.getElementById('pk_ath').value,document.getElementById('pk_h').value,document.getElementById('pk_pay').checked,document.getElementById('pk_pool').value); if(!r.ok){document.getElementById('pk_res').textContent=r.errors.join(' ');return;} finMsg='Paket tanımlandı.'; renderFinance($('#content'));}
function pkgDel(id){if(!confirm('Paket silinsin mi?'))return; const r=removePackage(id); finMsg=r.ok?'Paket silindi.':r.errors.join(' '); renderFinance($('#content'));}

/* ---------- HAVUZ KİRALAMA EKRANI ---------- */
function renderRentals(c){
  if(role!=='admin'){c.innerHTML='';return;}
  const ym=curYm(); const list=(DB.rentals||[]).slice().reverse();
  c.innerHTML=`${takeMsg()}<div style="margin-bottom:14px;"><button class="btn primary" onclick="rentOpen()">+ Yeni Kiralama Kaydı</button></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));">
  ${list.map(r=>{const p=DB.pools.find(x=>x.name===r.pool); const a=rentalAmount(r,ym); const paid=(r.paidMonths||[]).indexOf(ym)>-1;
   return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;"><b>${escHtml(r.club)}</b><span class="badge aqua">${escHtml(r.pool)}</span></div>
    <div style="font-size:12.5px;color:var(--muted);margin-top:6px;">Yetkili: ${escHtml(r.contact)}${r.phone?' · '+escHtml(r.phone):''}<br>Antrenör: ${escHtml(r.coachName)}</div>
    <div style="font-size:12.5px;margin-top:8px;">${escHtml(r.days.join('/'))} · ${escHtml(r.start)}-${escHtml(r.end)}${p&&p.lanes>0?' · <b>'+r.lanes+' kulvar</b>':' · tüm havuz'}</div>
    <div style="font-size:12px;color:var(--muted);margin-top:2px;">${escHtml(fmtDate(r.startDate))} – ${r.endDate?escHtml(fmtDate(r.endDate)):'süresiz'} · ${money(r.laneFee)} / ${p&&p.lanes>0?'kulvar-saat':'saat'}</div>
    <div style="margin-top:8px;font-size:13px;">${monthLabel(ym)}: <b>${money(a)}</b> ${a>0?(paid?'<span class="badge green">Tahsil edildi</span>':'<span class="badge amber">Bekliyor</span>'):''}</div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">${a>0?`<button class="btn sm" onclick="rentPaid('${r.id}',${paid?'false':'true'})">${paid?'Tahsilatı geri al':'Tahsil edildi'}</button>`:''}<button class="btn sm" onclick="rentOpen('${r.id}')">Düzenle</button><button class="btn sm danger" onclick="rentDel('${r.id}')">Sil</button></div></div>`;}).join('')||'<div class="empty">Henüz kiralama kaydı yok</div>'}</div>`;
}
function rentPaid(id,paid){rentalSetPaid(id,curYm(),paid); renderRentals($('#content'));}
function rentDel(id){const r=(DB.rentals||[]).find(x=>x.id===id); if(!r||!confirm(r.club+' kaydı silinsin mi?')) return; removeRental(id); mgmtMsg='Kiralama kaydı silindi.'; renderRentals($('#content'));}

  const t=(k,d)=>escHtml(r?r[k]:d);
  openDrawerHtml(`<div class="drawer-head"><div><div style="font-weight:800;font-size:16px;">${r?'Kiralamayı düzenle':'Yeni havuz kiralama'}</div><div style="font-size:12.5px;color:var(--muted);">Kulvar uygunluğu kaydetmeden önce gruplar ve diğer kiralamalarla kontrol edilir.</div></div><button class="close-x" onclick="closeDrawer()">✕</button></div>

  <div class="field"><label for="rn_coach">Antrenör (ad soyad)</label><input id="rn_coach" maxlength="60" value="${t('coachName','')}" oninput="rentCheck()"></div>

   <div class="field"><label for="rn_pool">Kiralanacak havuz</label><select id="rn_pool" onchange="rentCheck()"><option value="">Havuz seçin</option>${opt(DB.pools.map(p=>[p.name,p.name+(p.lanes>0?' ('+p.lanes+' kulvar)':' (kulvarsız)')]),r?r.pool:'')}</select></div>
   <div class="field"><label for="rn_lanes">Kulvar adedi</label><input id="rn_lanes" type="number" min="1" max="12" value="${r?r.lanes:''}" oninput="rentCheck()"></div></div>

function trLower(s){return String(s==null?'':s).toLocaleLowerCase('tr');}
function digitsOf(s){return String(s||'').replace(/\D/g,'');}
function searchBarHtml(kind){
  const f=(id,l)=>`<div class="field" style="margin:0;"><label for="${id}">${l}</label><input id="${id}" autocomplete="off" oninput="applySearch('${kind}')"></div>`;
  return `<div class="card" style="margin-bottom:14px;"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;">${f('sf_first','Ad')}${f('sf_last','Soyad')}${f('sf_phone','Telefon')}<div id="sf_count" style="font-size:12.5px;color:var(--muted);padding-bottom:8px;"></div></div></div>`;
}
function matchPerson(o,q){
  if(q.first&&trLower(o.first).indexOf(q.first)<0) return false;
  if(q.last&&trLower(o.last).indexOf(q.last)<0) return false;
  if(q.phone){const d=digitsOf(q.phone); if(d&&!o.phones.some(p=>digitsOf(p).indexOf(d)>-1)) return false;}
  return true;
}
function applySearch(kind){
  const g=id=>{const e=document.getElementById(id); return e?e.value.trim():'';};
  const q={first:trLower(g('sf_first')),last:trLower(g('sf_last')),phone:g('sf_phone')};
  const rows=kind==='athletes'?$$('#athBody tr.rowlink'):$$('#content tbody tr.rowlink');
  let shown=0;
  rows.forEach(tr=>{
    const m=/open(?:Athlete|Parent)\('([^']+)'\)/.exec(tr.getAttribute('onclick')||''); let ok=true;
    if(m){
      if(kind==='athletes'){const a=DB.athletes.find(x=>x.id===m[1]); const ph=[a.phone]; if(role==='admin') a.parents.forEach(pid=>{const p=DB.parents.find(x=>x.id===pid); if(p) ph.push(p.phone);}); ok=matchPerson({first:a.first||a.name,last:a.last||'',phones:ph},q);}
      else {const p=DB.parents.find(x=>x.id===m[1]); ok=matchPerson({first:p.first||p.name,last:p.last||'',phones:[p.phone]},q);}
    }
    tr.style.display=ok?'':'none'; if(ok) shown++;
  });
  const cnt=document.getElementById('sf_count'); if(cnt) cnt.textContent=(q.first||q.last||q.phone)?shown+' sonuç':'';
}

function globalSearch(q){

  const hit=(name,phones)=>toks.every(t=>trLower(name).indexOf(t)>-1||(digitsOf(t).length>=3&&phones.some(p=>digitsOf(p).indexOf(digitsOf(t))>-1)));

let aiTab=null;

function fmtTime(sec){
  if(sec<60) return sec.toFixed(2);
  const m=Math.floor(sec/60);
  return m+':'+(sec-m*60).toFixed(2).padStart(5,'0');
}
function spark(arr){
  if(!arr||arr.length<2) return '';
  const w=84,h=26;
  const pts=arr.map((v,i)=>[2+(i/(arr.length-1))*(w-4), h-3-Math.max(0,Math.min(1,(v-0.3)/0.7))*(h-6)]);
  const last=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" role="img" aria-label="Devam oranı trendi"><polyline fill="none" stroke="var(--teal-600)" stroke-width="2" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" fill="var(--coral)"/></svg>`;
}
function riskBadge(r){
  const cls=r.level==='Yüksek'?'red':r.level==='Orta'?'amber':'green';
  return `<span class="badge ${cls}">${r.level} · ${r.score}/100</span>`;
}

/* --- hesaplamalar --- */
function aiRisk(a,withFinance){
  const reasons=[]; let score=0;
  const att=a.attendance;
  score+=Math.round((1-att)*60);
  if(att<0.7) reasons.push(`Devam oranı %${Math.round(att*100)} (hedef %70 üzeri)`);
  const t=a.attTrend||[att];
  const drop=t[0]-t[t.length-1];
  if(drop>0.1){ score+=Math.min(25,Math.round(drop*60)); reasons.push(`Son ${t.length} ayda devam oranı %${Math.round(drop*100)} puan düştü`); }
  if(withFinance && DB.payments.some(p=>p.athlete===a.id&&p.status==='overdue')){ score+=15; reasons.push('Gecikmiş ödeme var'); }
  score=Math.min(100,score);
  const level=score>=40?'Yüksek':score>=20?'Orta':'Düşük';
  return {score,level,reasons};
}
function aiProgress(id){
  const by={};
  DB.records.filter(r=>r.athlete===id).forEach(r=>{(by[r.event]=by[r.event]||[]).push(r);});
  return Object.keys(by).map(ev=>{
    const arr=by[ev].slice().sort((x,y)=>new Date(x.date)-new Date(y.date));
    const first=arr[0].time,last=arr[arr.length-1].time;
    return {event:ev,first,last,best:Math.min(...arr.map(x=>x.time)),count:arr.length,pct:arr.length>1?(first-last)/first*100:0};
  });
}
function aiTrendText(a){
  const t=a.attTrend||[a.attendance];
  if(t.length<2) return '';
  const d=t[0]-t[t.length-1];
  if(d>0.05) return `son ${t.length} ayda %${Math.round(d*100)} puan düştü`;
  if(d<-0.05) return `son ${t.length} ayda %${Math.round(-d*100)} puan arttı`;
  return `son ${t.length} ayda yatay seyretti`;
}
function aiAthleteStaff(a){
  const risk=aiRisk(a,role==='admin');
  const prog=aiProgress(a.id);
  const obs=[`Devam oranı %${Math.round(a.attendance*100)}`+(aiTrendText(a)?` (${aiTrendText(a)})`:'')];
  if(prog.length) prog.forEach(p=>obs.push(`${p.event}: ${fmtTime(p.first)} → ${fmtTime(p.last)}`+(p.count>1?` (%${p.pct.toFixed(1)} gelişim, ${p.count} kayıt)`:' (tek kayıt)')));
  else obs.push('Henüz kayıtlı derece yok');
  const sug=[];
  if(a.attendance<0.7) sug.push({text:'Devam oranı hedefin altında. Veli ile görüşme planlanmalı.',action:{type:'Veli mesajı taslağı',title:`${a.name}: devam hatırlatma mesajı (taslak)`,athlete:a.id,detail:'Velinin bilgilendirilmesi ve ders saatinin uygunluğunun sorulması'}});
  const imp=prog.filter(p=>p.count>1&&p.pct>=5);
  if(imp.length&&a.attendance>=0.85) sug.push({text:`${imp.map(p=>p.event).join(', ')} derecelerinde belirgin gelişim var. Üst grup veya yarışma hazırlığı değerlendirilebilir.`,action:{type:'Seviye değerlendirmesi',title:`${a.name}: seviye / grup değerlendirmesi`,athlete:a.id,detail:'Antrenör değerlendirmesi sonrası grup değişikliği kararı yönetici onayıyla alınır'}});
  if(a.license==='Vizesiz'||a.license==='Süresi dolmuş') sug.push({text:`Lisans durumu: ${a.license}. Vize veya yenileme hatırlatması yapılmalı.`,action:{type:'Veli mesajı taslağı',title:`${a.name}: lisans vizesi hatırlatma (taslak)`,athlete:a.id,detail:'Lisans vize / yenileme bilgilendirmesi'}});
  if(!prog.length) sug.push({text:'Başlangıç referansı için bir test seti yapılıp ilk derece kaydedilmeli.'});
  if(!sug.length) sug.push({text:'Belirgin bir risk veya fırsat görünmüyor. Mevcut planla devam edilebilir.'});
  return {risk,obs,sug};
}
function aiAthleteParent(a){
  const first=a.name.split(' ')[0];
  const out=[];
  const att=Math.round(a.attendance*100);
  if(a.attendance>=0.85) out.push(`${first} derslere çok düzenli katılıyor (%${att}).`);
  else if(a.attendance>=0.7) out.push(`${first} derslere genel olarak düzenli katılıyor (%${att}).`);
  else out.push(`${first} son dönemde bazı derslere katılamadı (%${att}). Ders saati uygun değilse antrenörle görüşebilirsiniz.`);
  out.push(`Şu an ${a.level} seviyesinde çalışıyor.`);
  const prog=aiProgress(a.id);
  prog.forEach(p=>{
    if(p.count>1&&p.pct>0) out.push(`${p.event}: ${fmtTime(p.first)} → ${fmtTime(p.last)}. Daha hızlı yüzüyor (%${p.pct.toFixed(1)} iyileşme).`);
    else if(p.count>1) out.push(`${p.event}: ${fmtTime(p.first)} → ${fmtTime(p.last)}. Derecede bu dönem belirgin bir değişim yok.`);
    else out.push(`${p.event}: ${fmtTime(p.last)} ile ilk derece kaydedildi.`);
  });
  if(!prog.length) out.push('Henüz derece kaydı yok. Antrenör bir test çalışması planladığında burada görünecek.');
  out.push('Hedef belirlemek ve gelişim planını konuşmak için antrenörünüzle görüşebilirsiniz.');
  return out;
}

function aiTraining(gid){
  if(!canViewGroup(gid)) return null;
  const g=DB.groups.find(x=>x.id===gid); if(!g) return null;
  const hist=(DB.trainings||[]).filter(t=>t.group===gid).sort((x,y)=>new Date(y.date)-new Date(x.date)).slice(0,10);
  const pools={'Başlangıç':['Suya güven','Nefes','Ayak çalışması','Süzülme'],'Orta':['Teknik','Dayanıklılık','Koordinasyon','Nefes'],'İleri':['Teknik','Dayanıklılık','Sprint','IM'],'Yarışmacı':['Teknik','Dayanıklılık','Sprint','IM'],'Yetişkin':['Teknik','Dayanıklılık','Nefes']};
  const pool=pools[g.level]||pools['Orta'];
  const counts={}; pool.forEach(f=>counts[f]=0);
  hist.forEach(h=>{counts[h.focus]=(counts[h.focus]||0)+1;});
  const next=pool.slice().sort((x,y)=>counts[x]-counts[y])[0];
  const sum=hist.reduce((s,h)=>s+h.meters,0);
  const avg=hist.length?Math.round(sum/hist.length):0;
  const recent=hist.slice(0,5);
  const recentAvg=recent.length?recent.reduce((s,h)=>s+h.meters,0)/recent.length:0;
  const step=g.level==='Başlangıç'?50:100;
  const T=hist.length?Math.max(step,Math.round(recentAvg*1.05/step)*step):0;
  const warm=Math.round(T*0.2/25)*25, drill=Math.round(T*0.2/25)*25, cool=Math.round(T*0.1/25)*25, main=T-warm-drill-cool;
  const desc={'Teknik':'teknik drilller ve kulaç düzeltme','Dayanıklılık':'aerobik tempo serileri','Sprint':'kısa mesafe maksimum sürat serileri','IM':'karışık stil geçişleri','Koordinasyon':'kol-bacak koordinasyon çalışmaları','Nefes':'nefes kontrolü ve ritim çalışmaları','Suya güven':'su içi oyunlar ve yüz batırma','Ayak çalışması':'şamandıra ile ayak çalışması','Süzülme':'itiş sonrası süzülme çalışmaları'};
  const obs=[];
  const members=DB.athletes.filter(a=>a.group===gid&&a.status==='active');
  const gAvg=members.length?Math.round(members.reduce((s,a)=>s+a.attendance,0)/members.length*100):0;
  if(hist.length){
    obs.push(`Son ${hist.length} antrenman: toplam ${sum.toLocaleString('tr-TR')} m, seans başına ortalama ${avg.toLocaleString('tr-TR')} m.`);
    obs.push('Odak dağılımı: '+Object.keys(counts).filter(k=>counts[k]>0).map(k=>k+' '+counts[k]).join(', ')+'.');
    const top=Object.keys(counts).sort((x,y)=>counts[y]-counts[x])[0];
    if(counts[top]/hist.length>=0.5) obs.push(`${top} odaklı seanslar ağırlıkta (${counts[top]}/${hist.length}). Denge için "${next}" önerilir.`);
  }
  obs.push(`Grup devam ortalaması %${gAvg}.`);
  const nf=x=>x.toLocaleString('tr-TR');
  const draft=hist.length?[`Isınma: ${nf(warm)} m`,`Teknik / drill: ${nf(drill)} m`,`Ana set (${next}): ≈ ${nf(main)} m, ${desc[next]||'seçili odak'}`,`Soğuma: ${nf(cool)} m`]:[];
  return {g,hist,obs,next,T,draft};
}

      sbShowRes(r.ok?'Bu adres sistemde kayıtlıysa şifre sıfırlama bağlantısı gönderildi. Gelen kutunuzu kontrol edin.':r.error,r.ok); return;
    }
    if(pw.length<8){ sbShowRes('Şifre en az 8 karakter olmalı.'); return; }
    if(sbMode==='signup'){
      if(pw!==(document.getElementById('sb_pass2').value||'')){ sbShowRes('Şifreler aynı değil.'); return; }
      const r=await sbAuth('signup',{email,password:pw});
      if(!r.ok){ sbShowRes(r.error); return; }
      if(r.data.access_token){ sbStoreSession(sbFromTokenResponse(r.data)); await sbStart(); return; }
      sbShowRes('Hesabınız oluşturuldu. E-postanıza gelen doğrulama bağlantısına tıkladıktan sonra giriş yapabilirsiniz.',true); return;
    }
    const r=await sbAuth('token?grant_type=password',{email,password:pw});
    if(!r.ok){ sbShowRes(r.error); return; }
    sbStoreSession(sbFromTokenResponse(r.data)); await sbStart();
  } finally { sbBusy(false); }
}

/* ---------- Veri yükleme ---------- */
const sbCmp=(a,b)=>String(a).localeCompare(String(b),'tr',{numeric:true});
async function sbLoadAll(){
  let rows=[];
  for(let from=0;;from+=1000){
    const r=await sbReq('GET','/rest/v1/documents?select=collection,id,data&order=collection.asc,id.asc',undefined,{Range:from+'-'+(from+999),'Range-Unit':'items'});
    if(!r.ok) return {ok:false,network:r.network,status:r.status};
    rows=rows.concat(r.data||[]); if((r.data||[]).length<1000) break;
  }
  const db=sbEmptyDB(); const slots=[];
  const spec={}; SB_SPECS.forEach(s=>{spec[s.c]=s;});
  rows.sort((a,b)=>sbCmp(a.collection,b.collection)||sbCmp(a.id,b.id));
  rows.forEach(r=>{
    if(r.collection==='slots'){ slots.push(r.data); return; }
    if(r.collection==='plPackagesPub'){ if(role!=='admin') db.plPackages.push(r.data); return; }
    const s=spec[r.collection]; if(!s) return;
    if(s.t==='arr') db[s.c].push(r.data); else db[s.c][r.id]=s.wrap?r.data[s.wrap]:r.data;
  });
  if(role!=='admin'){
    const have=new Set(db.privateLessons.map(p=>p.id));
    slots.forEach(s=>{ if(!have.has(s.id)) db.privateLessons.push({id:s.id,pkg:null,athlete:'',coach:s.coach,date:s.date,hour:s.hour,status:s.status,note:'',_stub:true}); });
  }
  const p=SB.profile; db.currentUser={parentId:p.role==='parent'?p.link_id:null,coachId:p.role==='coach'?p.link_id:null,athleteId:p.role==='athlete'?p.link_id:null};
  DB=db; sbBaseline(); SB.lastLoad=Date.now();
  return {ok:true,count:rows.length};
}
function sbSnapshot(){
  const out={};
  SB_SPECS.forEach(s=>{
    if(!sbWritable(s.c)) return;
    if(s.t==='arr'){ (DB[s.c]||[]).forEach(x=>{ if(!x||x._stub) return; const id=String(x[s.key||'id']); out[s.c+'|'+id]={c:s.c,id,data:x}; }); }
    else { const m=DB[s.c]||{}; Object.keys(m).forEach(k=>{ out[s.c+'|'+k]={c:s.c,id:k,data:s.wrap?{[s.wrap]:m[k]}:m[k]}; }); }
  });
  return out;
}
function sbBaseline(){
  SB.synced={}; SB.base={};
  const snap=sbSnapshot();
  Object.keys(snap).forEach(k=>{ const j=JSON.stringify(snap[k].data); SB.synced[k]=j; SB.base[k]=j; });
}
function sbDiff(){
  const snap=sbSnapshot(); const adds=[],upds=[],dels=[];
  Object.keys(snap).forEach(k=>{
    const j=JSON.stringify(snap[k].data);
    if(!(k in SB.synced)) adds.push({k,c:snap[k].c,id:snap[k].id,data:snap[k].data,j});
    else if(SB.synced[k]!==j) upds.push({k,c:snap[k].c,id:snap[k].id,data:snap[k].data,j});
  });
  Object.keys(SB.synced).forEach(k=>{ if(!(k in snap)){ const i=k.indexOf('|'); dels.push({k,c:k.slice(0,i),id:k.slice(i+1)}); } });
  return {adds,upds,dels};
}

/* ---------- Kaydetme (fark gönderimi) ---------- */
function sbStatus(t,cls){ const el=document.getElementById('sbStatus'); if(el){ el.textContent=t; el.className='sb-status '+(cls||''); } }
function sbScheduleSync(){ sbStatus('Kaydediliyor…','busy'); if(SB.timer) clearTimeout(SB.timer); SB.timer=setTimeout(()=>{SB.timer=null; sbSyncNow();},300); }
function sbIdle(){ return new Promise(res=>{ const t=()=>{ if(!SB.timer&&!SB.syncing&&!SB.retry) res(); else setTimeout(t,20); }; t(); }); }
const sbEnc=encodeURIComponent;
async function sbPush(d){
  const admin=role==='admin';
  const writeBatch=async(items)=>{
    for(let i=0;i<items.length;i+=100){
      const part=items.slice(i,i+100);
      const r=await sbReq('POST',admin?'/rest/v1/documents?on_conflict=collection,id':'/rest/v1/documents',part.map(x=>({collection:x.c,id:x.id,data:x.data})),{Prefer:admin?'resolution=merge-duplicates,return=minimal':'return=minimal'});
      if(!r.ok) return r;
      part.forEach(x=>{SB.synced[x.k]=x.j; SB.base[x.k]=x.j;});
    }
    return {ok:true};
  };
  if(d.adds.length){ const r=await writeBatch(d.adds); if(!r.ok) return r; }
  if(d.upds.length){
    if(admin){ const r=await writeBatch(d.upds); if(!r.ok) return r; }
    else for(const x of d.upds){
      let payload=x.data;
      if(x.c==='athletes'){ const b=JSON.parse(SB.base[x.k]); if(!x.data.leave) return {ok:false,status:403,rejected:true}; payload=Object.assign({},b,{leave:x.data.leave}); }
      const r=await sbReq('PATCH','/rest/v1/documents?collection=eq.'+sbEnc(x.c)+'&id=eq.'+sbEnc(x.id),{data:payload},{Prefer:'return=representation'});
      if(!r.ok) return r;
      if(!Array.isArray(r.data)||!r.data.length) return {ok:false,status:403,rejected:true};
      SB.synced[x.k]=x.j; SB.base[x.k]=JSON.stringify(payload);
    }
  }
  for(const x of d.dels){
    const r=await sbReq('DELETE','/rest/v1/documents?collection=eq.'+sbEnc(x.c)+'&id=eq.'+sbEnc(x.id),undefined,{Prefer:'return=representation'});
    if(!r.ok) return r;
    if(!admin&&(!Array.isArray(r.data)||!r.data.length)) return {ok:false,status:403,rejected:true};
    delete SB.synced[x.k]; delete SB.base[x.k];
  }
  return {ok:true};
}
async function sbSyncNow(){
  if(!SERVER||!SB.profile) return;
  if(SB.syncing){ SB.again=true; return; }
  SB.syncing=true;
  try{
    do{
      SB.again=false;
      const d=sbDiff(); if(!d.adds.length&&!d.upds.length&&!d.dels.length) break;
      const r=await sbPush(d);
      if(r.ok){ continue; }
      if(r.network||r.status===0){ sbStatus('Bağlantı yok — değişiklikler bekliyor','bad'); if(!SB.retry) SB.retry=setTimeout(()=>{SB.retry=null; sbSyncNow();},8000); SB.syncing=false; return; }
      if(r.status===401){ SB.syncing=false; return; }
      /* Sunucu reddetti: yerel değişiklikleri at, sunucudaki gerçek veriyi göster */
      SB.syncing=false;
      sbStatus('Değişiklik reddedildi','bad');
      await sbReload(true,'Son işlem sunucu tarafından kabul edilmedi (yetkiniz olmayabilir). Ekran sunucudaki güncel veriyle yenilendi.');
      return;
    }while(SB.again);
    sbStatus('Kaydedildi ✓','good');
  } finally { SB.syncing=false; }
}
async function sbReload(rerender,notice){
  const r=await sbLoadAll();
  if(!r.ok){ sbStatus('Veri yenilenemedi','bad'); return false; }
  if(rerender){ render(); if(notice){ const c=document.getElementById('content'); if(c) c.insertAdjacentHTML('afterbegin',`<div class="note-banner" style="background:var(--red-light);color:var(--red);">${escHtml(notice)}</div>`); } }
  return true;
}

/* ---------- Oturum başlatma ---------- */
async function sbStart(){
  sbShowLoading();
  const uid=SB.session&&SB.session.user.id;
  if(!uid){ sbShowLogin(); return; }
  const pr=await sbReq('GET','/rest/v1/profiles?select=id,email,role,link_id&id=eq.'+sbEnc(uid));
  if(!pr.ok){ if(pr.status===401) return; sbShowError('Sunucuya bağlanılamadı. İnternet bağlantınızı kontrol edip tekrar deneyin.'); return; }
  if(!pr.data||!pr.data.length){ SB.profile=null; sbShowNoProfile(); return; }
  SB.profile=pr.data[0]; role=SB.profile.role;
  const r=await sbLoadAll();
  if(!r.ok){ sbShowError('Veriler yüklenemedi. Lütfen tekrar deneyin.'); return; }
  if(r.count===0){ if(role==='admin'){ sbShowSetup(); return; } sbShowWaitEmpty(); return; }
  sbEnter();
}
function sbEnter(){
  sbOverlay(''); document.body.classList.add('srv');
  const ft=document.getElementById('sbFoot'); if(ft) ft.innerHTML='<span id="sbStatus" class="sb-status">Sunucuya bağlı</span><br>Veriler güvenli sunucuda saklanır';
  route='dashboard'; render();

async function sbSetup(kind){
  if(role!=='admin') return;
  sbShowLoading('Kuruluyor…');
  const s=kind==='demo'?seed():null;
  const db=sbEmptyDB();
  if(s){ SB_SPECS.forEach(x=>{ if(s[x.c]!==undefined) db[x.c]=s[x.c]; }); db.records.forEach((x,i)=>{x.id=x.id||'r'+(i+1);}); }
  else db.pools=[{name:'Havuz 1',lanes:4,laneCapacity:1}];
  db.currentUser={parentId:null,coachId:null,athleteId:null};
  DB=db; SB.synced={}; SB.base={};
  await sbSyncNow();
  await sbIdle();
  const left=sbDiff(); 
  if(left.adds.length||left.upds.length){ sbShowError('Kurulum tamamlanamadı. Lütfen tekrar deneyin.'); return; }
  await sbLoadAll(); sbEnter();
}
async function sbSignOut(){
  if(SB.session){ try{ await sbAuth('logout',{},'POST',true); }catch(e){} }
  sbStoreSession(null); SB.profile=null; SB.synced={}; SB.base={}; DB=sbEmptyDB();
  document.body.classList.remove('srv'); const c=document.getElementById('content'); if(c) c.innerHTML='';
  sbMode='login'; sbShowLogin();

function sbHandleHash(){
  const h=String(location.hash||'').replace(/^#/,''); if(!h||h.indexOf('access_token')<0&&h.indexOf('error')<0) return null;
  const p=new URLSearchParams(h);
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){ try{location.hash='';}catch(_){ } }
  if(p.get('error_description')) return {error:p.get('error_description').replace(/\+/g,' ')};
  if(p.get('access_token')&&p.get('refresh_token')){
    const exp=Number(p.get('expires_at'))||(Math.floor(Date.now()/1000)+(Number(p.get('expires_in'))||3600));
    let uid='',email=''; try{ const pl=JSON.parse(atob(p.get('access_token').split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); uid=pl.sub||''; email=pl.email||''; }catch(e){}
    return {session:{access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),expires_at:exp,user:{id:uid,email}},type:p.get('type')};
  }
  return null;
}
async function boot(){
  if(!SERVER){ load(); render(); return; }
  DB=sbEmptyDB(); document.body.classList.add('srv');
  const h=sbHandleHash();
  if(h&&h.session){ sbStoreSession(h.session); if(h.type==='recovery'){ sbShowRecovery(); return; } }
  else SB.session=sbReadSession();
  if(h&&h.error){ sbShowLogin('Bağlantı geçersiz veya süresi dolmuş: '+h.error); return; }
  if(!SB.session){ sbShowLogin(); return; }
  await sbStart();
}

function personLabel(r,id){return r==='coach'?coachName(id):r==='parent'?parentName(id):r==='athlete'?athleteName(id):'—';}
async function acctLoad(){
  const a=await sbReq('GET','/rest/v1/profiles?select=id,email,role,link_id,created_at&order=created_at.asc');
  const b=await sbReq('GET','/rest/v1/pending_profiles?select=email,role,link_id,created_at&order=created_at.asc');

async function acctAdd(){
  if(role!=='admin') return;
  const email=String(document.getElementById('ac_email').value||'').trim().toLowerCase();
  const r=document.getElementById('ac_role').value; const link=r==='admin'?null:(document.getElementById('ac_person').value||'');
  const fail=t=>{acctData.msg=t; acctData.bad=true; acctDraw();};
  if(!sbEmailOk(email)) return fail('Geçerli bir e-posta adresi yazın.');
  if(['admin','coach','parent','athlete'].indexOf(r)<0) return fail('Rol seçin.');
  if(r!=='admin'){ if(!link||personLabel(r,link)==='—') return fail('Bağlı kişiyi seçin.'); }
  if(acctData.profiles.some(p=>String(p.email).toLowerCase()===email)||acctData.pending.some(p=>p.email===email)) return fail('Bu e-posta zaten tanımlı.');
  const res=await sbReq('POST','/rest/v1/pending_profiles',{email,role:r,link_id:link},{Prefer:'return=minimal'});
  if(!res.ok) return fail(res.status===409?'Bu e-posta zaten tanımlı.':'Hesap tanımlanamadı.');
  acctData.msg='Tanımlandı. Kişi “Hesap oluşturun” bağlantısıyla şifresini belirleyip e-postasını doğruladığında giriş yapabilir.'; acctData.bad=false;
  await acctLoad();
}

  const res=await sbReq('DELETE','/rest/v1/pending_profiles?email=eq.'+sbEnc(email),undefined,{Prefer:'return=minimal'});
  acctData.msg=res.ok?'Tanım iptal edildi.':'İşlem yapılamadı.'; acctData.bad=!res.ok; await acctLoad();
}
async function acctRemoveProfile(id){
  if(role!=='admin'||id===(SB.session&&SB.session.user.id)) return;
  if(!confirm('Bu kullanıcının sisteme erişimi kaldırılsın mı?')) return;
  const res=await sbReq('DELETE','/rest/v1/profiles?id=eq.'+sbEnc(id),undefined,{Prefer:'return=minimal'});
  acctData.msg=res.ok?'Erişim kaldırıldı. Kişi artık giriş yapsa bile veri göremez.':'İşlem yapılamadı.'; acctData.bad=!res.ok; await acctLoad();
}

boot();
