<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Club — Sports Management Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2A2E;
  --teal-900:#0B2E33;
  --teal-700:#0F4C4F;
  --teal-600:#146569;
  --aqua:#1FB6AE;
  --aqua-light:#E4F7F5;
  --coral:#F2794A;
  --coral-light:#FDEBE1;
  --bg:#F5F8F7;
  --card:#FFFFFF;
  --line:#E1E9E8;
  --muted:#5C7477;
  --amber:#D9A441;
  --amber-light:#FBF1DE;
  --red:#D65B4A;
  --red-light:#FCEAE6;
  --green:#3F9463;
  --green-light:#E7F4EC;
  --radius:10px;
  font-size:15px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EAF3F2; --bg:#0B1516; --card:#12201F; --line:#20302E; --muted:#8FA8A6;
    --aqua-light:#12302D; --coral-light:#2E1F17; --amber-light:#2C2416; --red-light:#2E1B18; --green-light:#152C1F;
  }
}
:root[data-theme="dark"]{
  --ink:#EAF3F2; --bg:#0B1516; --card:#12201F; --line:#20302E; --muted:#8FA8A6;
  --aqua-light:#12302D; --coral-light:#2E1F17; --amber-light:#2C2416; --red-light:#2E1B18; --green-light:#152C1F;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.disp{font-family:'Manrope',system-ui,sans-serif; font-weight:800; letter-spacing:-0.01em;}
button{font-family:inherit;}
.app{display:flex; min-height:100vh;}

/* Sidebar */
.sidebar{
  width:230px; flex:none; background:var(--teal-900); color:#DCEFEC;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:22px 20px 14px; display:flex; align-items:center; gap:10px;}
.brand .mark{width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--aqua),#0C7C79); display:flex; align-items:center; justify-content:center; font-size:18px;}
.brand .name{font-family:'Manrope'; font-weight:800; font-size:16.5px; color:#fff; line-height:1.1;}
.brand .sub{font-size:10.5px; color:#8FBAB6; letter-spacing:.03em;}
.role-pill{margin:0 16px 14px; padding:8px 10px; border-radius:8px; background:rgba(255,255,255,.06); font-size:12px; color:#B7DCD8; display:flex; align-items:center; justify-content:space-between; gap:6px;}
.role-pill select{background:transparent; color:#fff; border:none; font-size:12px; font-family:inherit; font-weight:600;}
.role-pill select option{color:#0B2E33;}
nav{padding:4px 10px; flex:1;}
nav a{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; color:#B7DCD8;
  text-decoration:none; font-size:13.5px; font-weight:500; margin-bottom:2px; cursor:pointer; white-space:nowrap;
}
nav a .ic{width:18px; text-align:center; font-size:14px; opacity:.9;}
nav a:hover{background:rgba(255,255,255,.06); color:#fff;}
nav a.active{background:var(--aqua); color:#04211F; font-weight:700;}
nav .sect{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#5F8B87; padding:14px 12px 6px;}
.sidebar-foot{padding:14px 18px; font-size:11px; color:#5F8B87; border-top:1px solid rgba(255,255,255,.08);}

/* Main */
.main{flex:1; min-width:0;}
.topbar{
  position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line);
  padding:16px 28px; display:flex; align-items:center; justify-content:space-between; gap:16px; backdrop-filter:blur(6px);
}
.topbar h1{font-size:20px; margin:0;}
.search{
  display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
  border-radius:9px; padding:8px 12px; min-width:260px; color:var(--muted); font-size:13px;
}
.search input{border:none; outline:none; background:transparent; color:var(--ink); font-size:13px; width:100%; font-family:inherit;}
.content{padding:24px 28px 60px; max-width:1320px;}

/* Cards / grid */
.grid{display:grid; gap:16px;}
.grid.kpi{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px;}
.kpi .card{padding:16px 18px;}
.kpi .label{font-size:12px; color:var(--muted); font-weight:600; margin-bottom:8px;}
.kpi .val{font-family:'Manrope'; font-size:26px; font-weight:800;}
.kpi .delta{font-size:11.5px; margin-top:6px; font-weight:600;}
.delta.up{color:var(--green);} .delta.down{color:var(--red);}

.section-title{font-size:15px; font-weight:700; margin:28px 0 12px; display:flex; align-items:center; justify-content:space-between;}
.two-col{display:grid; grid-template-columns:1.4fr 1fr; gap:16px;}
@media(max-width:980px){.two-col{grid-template-columns:1fr;}}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:9px 10px; border-bottom:1px solid var(--line); font-weight:700;}
td{padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.rowlink{cursor:pointer;}
tr.rowlink:hover{background:var(--aqua-light);}

.badge{display:inline-block; padding:3px 9px; border-radius:100px; font-size:11px; font-weight:700;}
.badge.green{background:var(--green-light); color:var(--green);}
.badge.amber{background:var(--amber-light); color:var(--amber);}
.badge.red{background:var(--red-light); color:var(--red);}
.badge.aqua{background:var(--aqua-light); color:var(--teal-600);}
.badge.grey{background:var(--line); color:var(--muted);}

.btn{border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;}
.btn:hover{border-color:var(--aqua);}
.btn.primary{background:var(--aqua); border-color:var(--aqua); color:#04211F;}
.btn.primary:hover{filter:brightness(1.05);}
.btn.ghost{background:transparent; border-color:transparent; color:var(--teal-600);}
.btn.sm{padding:5px 10px; font-size:12px;}
.btn.danger{color:var(--red); border-color:var(--red-light);}

.pillbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.pillbar .p{padding:6px 12px; border-radius:100px; background:var(--card); border:1px solid var(--line); font-size:12.5px; font-weight:600; cursor:pointer; color:var(--muted);}
.pillbar .p.active{background:var(--teal-700); border-color:var(--teal-700); color:#fff;}

.avatar{overflow:hidden;width:32px; height:32px; border-radius:8px; background:var(--aqua-light); color:var(--teal-600); display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; margin-right:8px;}
.name-cell{display:flex; align-items:center;}

/* Drawer */
.overlay{position:fixed; inset:0; background:rgba(6,20,20,.45); z-index:40; display:none;}
.overlay.open{display:block;}
.drawer{
  position:fixed; top:0; right:0; height:100vh; width:min(520px,94vw); background:var(--card);
  z-index:41; transform:translateX(100%); transition:transform .25s ease; overflow-y:auto; box-shadow:-8px 0 30px rgba(0,0,0,.15);
}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:20px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; gap:12px; position:sticky; top:0; background:var(--card);}
.drawer-body{padding:6px 22px 30px;}
.close-x{background:none; border:none; font-size:20px; cursor:pointer; color:var(--muted); line-height:1;}
.tabs{display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--line); margin:0 22px;}
.tabs button{background:none; border:none; padding:10px 12px; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; font-family:inherit;}
.tabs button.active{color:var(--teal-600); border-bottom-color:var(--aqua);}

/* calendar */
.cal{display:grid; grid-template-columns:70px repeat(7,1fr); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--card);}
.cal .hcell{padding:10px 6px; text-align:center; font-size:12px; font-weight:700; background:var(--aqua-light); color:var(--teal-700); border-bottom:1px solid var(--line);}
.cal .tcell{padding:6px 4px; font-size:10.5px; color:var(--muted); border-right:1px solid var(--line); border-bottom:1px solid var(--line); text-align:right; padding-right:8px;}
.cal .slot{border-right:1px solid var(--line); border-bottom:1px solid var(--line); min-height:46px; padding:3px; position:relative;}
.evt{background:var(--aqua-light); color:var(--teal-700); border-left:3px solid var(--aqua); border-radius:5px; padding:4px 6px; font-size:10.5px; font-weight:600; margin-bottom:3px; cursor:pointer;}
.evt small{display:block; font-weight:500; color:var(--muted);}

/* kanban */
.kanban{display:flex; gap:12px; overflow-x:auto; padding-bottom:8px;}
.kcol{flex:0 0 220px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px;}
.kcol h4{font-size:12px; margin:2px 4px 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
.kcard{background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 10px; margin-bottom:8px; font-size:12.5px;}
.kcard .kname{font-weight:700; margin-bottom:3px;}
.kcard .ksub{color:var(--muted); font-size:11px;}

.empty{padding:30px; text-align:center; color:var(--muted); font-size:13px;}
.attn-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.attn-item{border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12.5px; display:flex; align-items:center; gap:8px; background:var(--bg);}
.attn-item select{border:1px solid var(--line); border-radius:6px; font-size:11.5px; padding:3px 5px; background:var(--card); color:var(--ink); font-family:inherit;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit; background:var(--bg); color:var(--ink);}
.note-banner{background:var(--amber-light); border:1px solid #EBD8AA; color:#7A5A1E; padding:10px 14px; border-radius:8px; font-size:12.5px; margin-bottom:18px;}
:root[data-theme="dark"] .note-banner, :root:not([data-theme="light"]) .note-banner{color:#E8CE93;}
.progress{height:7px; background:var(--line); border-radius:100px; overflow:hidden; margin-top:6px;}
.progress > div{height:100%; background:var(--aqua);}
.chart-wrap{overflow-x:auto;}
.evt.private{background:var(--coral-light);border-left-color:var(--coral);color:var(--ink);}
.cal .hcell.today{background:var(--aqua);color:#04211F;}
.tp-row select,.tp-row input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:inherit;font-size:13px;width:100%;box-sizing:border-box;}
@media(max-width:640px){.tp-row{grid-template-columns:1fr 90px 36px !important;}.tp-row select{grid-column:1/-1;}}
.dv{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--card);}
.dv-row{display:grid;grid-template-columns:64px 1fr;border-bottom:1px solid var(--line);min-height:48px;}
.dv-row:last-child{border-bottom:0;}
.dv-row .tcell{border-bottom:0;padding:10px 8px 6px 4px;}
.dv-cell{padding:5px 8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;}
.dv-cell .evt{font-size:12.5px;padding:6px 10px;margin:0;min-width:200px;flex:1 1 220px;max-width:420px;}
.dv-cell .evt small{font-size:11.5px;margin-top:2px;}
.dv-empty{color:var(--muted);font-size:12px;padding:6px 0;}
.vtog{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.vtog button{border:0;background:var(--card);padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);}
.vtog button.on{background:var(--teal-700);color:#fff;}
.weeknav{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.pgrid{display:grid;grid-template-columns:54px repeat(7,minmax(62px,1fr));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--card);min-width:540px;}
.pgrid .ph{padding:8px 4px;text-align:center;font-size:11.5px;font-weight:700;background:var(--aqua-light);color:var(--teal-700);border-bottom:1px solid var(--line);}
.pgrid .pt{padding:6px;font-size:11px;color:var(--muted);text-align:right;border-bottom:1px solid var(--line);border-right:1px solid var(--line);}
.pcell{display:flex;align-items:center;justify-content:center;min-height:34px;font-size:11.5px;font-weight:600;border:none;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:transparent;color:var(--ink);font-family:inherit;}
.pcell.free{cursor:pointer;color:var(--green);background:var(--green-light);}
.pcell.free:hover{filter:brightness(.95);}
.pcell.sel{cursor:pointer;background:var(--coral);color:#fff;}
.pcell.busy{background:var(--line);color:var(--muted);}
.pcell.req{background:var(--amber-light);color:var(--amber);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.report-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px;}
@media print{body.print-report .sidebar,body.print-report .topbar,body.print-report #drawer,body.print-report #overlay{display:none!important;}body.print-report #content>*:not(#fin_report){display:none!important;}body.print-report .main{margin:0!important;}body.print-report .report-wrap{border:none;}}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.me{cursor:pointer;display:flex;align-items:center;}
.navbadge{margin-left:auto;background:var(--coral);color:#fff;border-radius:100px;font-size:11px;font-weight:700;padding:1px 7px;}
.chkrow{display:flex;flex-wrap:wrap;gap:6px;}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--ink);}
.chk input{width:auto;margin:0;}
.grp-result{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:13px;background:var(--line);color:var(--muted);}
.grp-result.good{background:var(--green-light);color:var(--green);}
.grp-result.bad{background:var(--red-light);color:var(--red);}
.ai-list{margin:8px 0 0;padding-left:18px;font-size:13.5px;line-height:1.6;}
.ai-sug{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.5;}
.ai-sug:last-child{border-bottom:none;}
.hamburger{display:none;}
@media(max-width:840px){
  .sidebar{position:fixed; left:-240px; z-index:50; transition:left .2s;}
  .sidebar.open{left:0;}
  .hamburger{display:block; background:none; border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; font-size:15px;}
  .content{padding:18px;}
  .topbar{padding:14px 16px;}
  .search{min-width:0; flex:1;}
}

/* Giriş ekranı ve sunucu durumu */
#sbOverlay{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto;}
.sb-card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 24px;box-shadow:0 10px 40px rgba(0,0,0,.08);}
.sb-brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.sb-brand .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--aqua),#0C7C79);display:flex;align-items:center;justify-content:center;font-size:20px;}
.sb-brand .name{font-family:'Manrope';font-weight:800;font-size:18px;line-height:1.1;}
.sb-brand .sub{font-size:10.5px;color:var(--muted);letter-spacing:.04em;}
.sb-h{font-size:19px;margin:0 0 6px;}
.sb-p{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0 0 14px;}
.sb-msg{padding:9px 12px;border-radius:8px;font-size:13px;margin:0 0 12px;line-height:1.45;}
.sb-msg.bad{background:var(--red-light);color:var(--red);}
.sb-msg.good{background:var(--green-light);color:var(--green);}
.sb-links{display:flex;flex-direction:column;gap:8px;margin-top:16px;font-size:13px;}
.sb-links a{color:var(--teal-600);cursor:pointer;text-decoration:underline;}
.sb-status{font-size:11px;}
.sb-status.good{color:#7fe3b4;} .sb-status.bad{color:#ffb4a8;} .sb-status.busy{color:#f2d58a;}
body.srv .role-pill:not(#userPill){display:none;}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="mark">🏊</div><div><div class="name">Let's Club</div><div class="sub">SPORTS MANAGEMENT</div></div></div>
    <div class="role-pill">Görünüm:
      <select id="roleSelect" onchange="setRole(this.value)">
        <option value="admin">Yönetici</option>
        <option value="coach">Antrenör</option>
        <option value="parent">Veli</option>
        <option value="athlete">Sporcu</option>
      </select>
    </div>
    <div class="role-pill" id="userPill" style="display:none;"></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot" id="sbFoot">Prototip sürüm · v0.1<br>Demo verisi — tarayıcınızda saklanır</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="me" id="meBadge" title="Profilim / fotoğrafım" onclick="route='settings';render()"></div>
      <div class="search"><span>🔎</span><input id="globalSearch" placeholder="Sporcu, veli, grup, antrenör ara…" oninput="globalSearch(this.value)"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>

<script>
/* ============ DATA LAYER ============ */
const LS_KEY='letsclub_demo_v10';
let DB=null;
let role='admin';
let route='dashboard';

function seed(){
  const coaches=[
    {id:'c1',name:'Deniz Aksoy',phone:'0532 111 22 33',specialty:'Yarışmacı / İleri',groups:['g1','g3']},

    {id:'c4',name:'Nazlı Şahin',phone:'0535 444 55 66',specialty:'Yetişkin Yüzme',groups:['g5']},
  ];
  const groups=[

    {id:'g2',name:'Suya Adaptasyon',level:'Başlangıç',age:'5-7',pool:'Çocuk Havuzu',lane:'-',day:'Salı/Perş',time:'16:00-16:45',coach:'c2',capacity:10,enrolled:9},
    {id:'g3',name:'İleri Seviye B',level:'İleri',age:'10-13',pool:'Kapalı Havuz',lane:'3',day:'Pzt/Çar/Cum',time:'18:30-20:00',coach:'c1',capacity:12,enrolled:12},
    {id:'g4',name:'Orta Seviye',level:'Orta',age:'8-11',pool:'Açık Havuz',lane:'2',day:'Salı/Perş/Cmt',time:'17:00-18:00',coach:'c3',capacity:14,enrolled:10},
    {id:'g5',name:'Yetişkin Yüzme',level:'Yetişkin',age:'18+',pool:'Kapalı Havuz',lane:'4',day:'Salı/Perş',time:'20:00-21:00',coach:'c4',capacity:16,enrolled:8},
  ];
  const parents=[
    {id:'p1',name:'Murat Yıldız',phone:'0532 555 10 10',email:'murat.yildiz@mail.com',relation:'Baba',children:['a1']},
    {id:'p2',name:'Selin Demir',phone:'0533 555 20 20',email:'selin.demir@mail.com',relation:'Anne',children:['a2','a3']},
    {id:'p3',name:'Kerem Aydın',phone:'0534 555 30 30',email:'kerem.aydin@mail.com',relation:'Baba',children:['a4']},

function load(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){ DB=JSON.parse(raw); DB.photos=DB.photos||{}; DB.trainings=DB.trainings||[]; DB.poolPrices=DB.poolPrices||{}; DB.reasonNotes=DB.reasonNotes||{}; DB.changeRequests=DB.changeRequests||[]; }
    else { DB=seed(); save(); }
  }catch(e){ DB=seed(); }
}
function save(){ if(SERVER){ sbScheduleSync(); return; } try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){ console.error('storage error',e); } }

const $=(sel,root=document)=>root.querySelector(sel);
const $$=(sel,root=document)=>[...root.querySelectorAll(sel)];
function athleteName(id){const a=DB.athletes.find(x=>x.id===id); return a?a.name:'—';}
function groupName(id){const g=DB.groups.find(x=>x.id===id); return g?g.name:'—';}
function coachName(id){const c=DB.coaches.find(x=>x.id===id); return c?c.name:'—';}
function parentName(id){const p=DB.parents.find(x=>x.id===id); return p?p.name:'—';}
function initials(name){return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function money(n){return n.toLocaleString('tr-TR')+' ₺';}
function fmtDate(d){return new Date(d).toLocaleDateString('tr-TR');}
function age(dob){const d=new Date(dob),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;return a;}
function statusBadge(s){
  const map={active:['green','Aktif'],passive:['grey','Pasif'],paid:['green','Ödendi'],overdue:['red','Gecikti'],pending:['amber','Bekliyor'],
    trial:['amber','Deneme'],'Aktif':['green','Aktif'],'Vizesiz':['amber','Vizesiz'],'Yok':['grey','Yok'],'Başvuru':['aqua','Başvuru'],'Süresi dolmuş':['red','Süresi dolmuş']};
  const m=map[s]||['grey',s];
  return `<span class="badge ${m[0]}">${m[1]}</span>`;
}

/* ============ PERMISSION LAYER ============ */
/*PERM_START*/
function myParent(){return DB.parents.find(p=>p.id===DB.currentUser.parentId);}
function myCoach(){return DB.coaches.find(c=>c.id===DB.currentUser.coachId);}
function visibleAthletes(){
  const u=DB.currentUser;
  if(role==='admin') return DB.athletes;
  if(role==='coach'){
    const mine=DB.groups.filter(g=>g.coach===u.coachId||g.assistant===u.coachId).map(g=>g.id);
    return DB.athletes.filter(a=>a.coach===u.coachId||mine.includes(a.group));
  }
  if(role==='parent'){const p=myParent(); return p?DB.athletes.filter(a=>p.children.includes(a.id)):[];}
  if(role==='athlete') return DB.athletes.filter(a=>a.id===u.athleteId&&age(a.dob)>=18);
  return [];
}
function canViewAthlete(id){return visibleAthletes().some(a=>a.id===id);}
function canManageGroups(){return role==='admin';}
function visibleGroups(){
  if(role==='admin') return DB.groups;
  if(role==='coach') return DB.groups.filter(g=>g.coach===DB.currentUser.coachId||g.assistant===DB.currentUser.coachId);
  const ids=visibleAthletes().map(a=>a.group);
  return DB.groups.filter(g=>ids.includes(g.id));
}
function canViewGroup(id){return visibleGroups().some(g=>g.id===id);}
function canViewParent(){return role==='admin';}
function canSeeFinance(){return role==='admin'||role==='parent';}
function visiblePayments(){
  if(!canSeeFinance()) return [];
  const ids=visibleAthletes().map(a=>a.id);
  return DB.payments.filter(p=>ids.includes(p.athlete));
}
function visibleRecords(){const ids=visibleAthletes().map(a=>a.id); return DB.records.filter(r=>ids.includes(r.athlete));}
function visibleTickets(){
  if(role==='admin') return DB.tickets;
  if(role==='parent') return DB.tickets.filter(t=>t.parent===DB.currentUser.parentId);
  return [];
}
function visibleAnnouncements(){
  const allowed={admin:null,coach:['Tüm Veliler','Antrenörler'],parent:['Tüm Veliler'],athlete:['Tüm Veliler']}[role];
  return allowed?DB.announcements.filter(a=>allowed.includes(a.audience)):DB.announcements;
}
function adultAthletes(){return DB.athletes.filter(a=>a.status==='active'&&age(a.dob)>=18);}
function canUseAI(){return role==='admin'||role==='coach'||role==='parent';}
function visibleAiQueue(){
  const q=DB.aiQueue||[];
  if(role==='admin') return q;
  if(role==='coach') return q.filter(x=>x.proposedBy===DB.currentUser.coachId);
  return [];
}
function visiblePrivateLessons(){
  const L=DB.privateLessons||[];
  if(role==='admin') return L;
  if(role==='coach') return L.filter(p=>p.coach===DB.currentUser.coachId);
  const ids=visibleAthletes().map(a=>a.id);
  return L.filter(p=>ids.includes(p.athlete));
}
function canRequestFor(athId){
  if(role==='parent'){const p=myParent(); return !!p&&p.children.includes(athId);}
  if(role==='athlete'){const a=DB.athletes.find(x=>x.id===athId); return !!a&&DB.currentUser.athleteId===athId&&age(a.dob)>=18;}
  return false;
}
function canDecidePL(p){return role==='admin'||(role==='coach'&&p.coach===DB.currentUser.coachId);}
function canCancelPL(p){
  if(p.status!=='Onay bekliyor'&&p.status!=='Onaylandı') return false;
  if(role==='admin') return true;
  if(role==='coach') return p.coach===DB.currentUser.coachId&&p.status==='Onaylandı';
  return canRequestFor(p.athlete);
}
/*PERM_END*/

function renderUserPill(){
  const el=$('#userPill');
  if(SERVER){ el.style.display='flex'; el.innerHTML=sbPillHtml(); return; }
  let opts=null,key=null,label='';
  if(role==='coach'){opts=DB.coaches.map(c=>[c.id,c.name]);key='coachId';label='Antrenör:';}
  if(!opts){el.style.display='none';return;}
  el.style.display='flex';
  el.innerHTML=label+'<select onchange="setUser(\''+key+'\',this.value)">'+opts.map(o=>'<option value="'+o[0]+'"'+(DB.currentUser[key]===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>';
}

function renderNav(){
  const nav=$('#nav'); nav.innerHTML='';
  NAV[role].forEach(item=>{
    if(item.sect){ const d=document.createElement('div'); d.className='sect'; d.textContent=item.sect; nav.appendChild(d); return; }
    const a=document.createElement('a');
    a.className = item.id===route ? 'active':'';
    a.innerHTML=`<span class="ic">${item.ic}</span>${item.label}${navBadge(item.id)?`<span class="navbadge">${navBadge(item.id)}</span>`:''}`;

function renderPipelineBar(){

  return `<div class="card"><div style="display:flex;gap:14px;align-items:flex-end;height:120px;">
    ${stages.map((s,i)=>`<div style="flex:1;text-align:center;">
      <div style="height:${80*counts[i]/max+6}px;background:var(--aqua);border-radius:6px 6px 0 0;"></div>

}
function recordsChart(recs){
  const w=440,h=140,pad=30;
  const times=recs.map(r=>r.time);
  const min=Math.min(...times)-1, max=Math.max(...times)+1;
  const pts=recs.map((r,i)=>{
    const x=pad+(i/(recs.length-1||1))*(w-pad*2);
    const y=h-pad-((r.time-min)/(max-min))*(h-pad*2);
    return [x,y,r];
  });
  const path=pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<div class="chart-wrap"><svg width="${w}" height="${h}" style="min-width:${w}px;">
    <path d="${path}" fill="none" stroke="var(--aqua)" stroke-width="2.5"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--teal-600)"/>`).join('')}
    ${pts.map(p=>`<text x="${p[0]}" y="${p[1]-10}" font-size="10" text-anchor="middle" fill="var(--ink)">${p[2].time}s</text>`).join('')}
  </svg><div style="font-size:11px;color:var(--muted);">${recs[0].event} — ${recs.map(r=>fmtDate(r.date)).join(' → ')}</div></div>`;
}

/* ============ GROUPS ============ */
/* ============ GRUP YÖNETİMİ (yeni grup ekleme / düzenleme + çakışma kontrolü) ============ */
const GRP_DAYS=['Pzt','Salı','Çar','Perş','Cum','Cmt','Paz'];
let grpMsg='';
window.__grpEdit=null;

function GRP_LEVELS(){
  const base=['Başlangıç','Orta','İleri','Yarışmacı','Yetişkin'];
  DB.groups.forEach(g=>{ if(base.indexOf(g.level)===-1) base.push(g.level); });
  return base;
}
function timeToMin(t){const m=/^(\d{1,2}):(\d{2})$/.exec(String(t||'').trim()); if(!m) return null; const h=+m[1],mi=+m[2]; if(h>23||mi>59) return null; return h*60+mi;}
function minToTime(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function laneList(str){
  const out=[];
  String(str||'').split(',').forEach(part=>{
    part=part.trim(); const m=/^(\d+)-(\d+)$/.exec(part);
    if(m){ for(let i=+m[1];i<=+m[2];i++) out.push(i); } else if(/^\d+$/.test(part)) out.push(+part);
  });
  return out;
}
function laneString(arr){
  const a=Array.from(new Set(arr)).sort((x,y)=>x-y);
  if(!a.length) return '-';
  const parts=[]; let s=a[0],p=a[0];
  for(let i=1;i<=a.length;i++){ if(a[i]===p+1){p=a[i];continue;} parts.push(s===p?String(s):s+'-'+p); s=a[i]; p=a[i]; }
  return parts.join(',');
}
function parseAge(str){
  const m=/^(\d+)-(\d+)$/.exec(String(str||'')); if(m) return {min:m[1],max:m[2]};
  const n=/^(\d+)\+$/.exec(String(str||'')); if(n) return {min:n[1],max:''};
  return {min:'',max:''};
}
function rangesOverlap(a,b){return (a.startDate||'0000-00-00')<=(b.endDate||'9999-99-99')&&(b.startDate||'0000-00-00')<=(a.endDate||'9999-99-99');}
function groupDows(g){return new Set(String(g.day||'').split('/').map(k=>DAYTOKEN[k.trim()]).filter(x=>x!==undefined));}

/* --- grubun o tarihte aktif ve o gün yapılıp yapılmadığı (tarih aralığına duyarlı) --- */
function groupOnDay(g,ds){
  if(g.startDate&&ds<g.startDate) return false;
  if(g.endDate&&ds>g.endDate) return false;
  const dow=parseYmd(ds).getDay();
  return g.day.split('/').some(k=>DAYTOKEN[k.trim()]===dow);
}
/* --- öğretmen meşguliyeti: grup dersi (ana veya yardımcı) ya da onaylı özel ders; dakika hassasiyetinde --- */
function coachBusyInfo(coachId,ds,s,e,ignoreGroupId,ignoreLessonId){
  const g=DB.groups.find(x=>x.id!==ignoreGroupId&&(x.coach===coachId||x.assistant===coachId)&&groupOnDay(x,ds)&&plOverlap(groupMinutes(x),[s,e]));
  if(g) return {type:'group',ref:g.id};
  const p=(DB.privateLessons||[]).find(x=>x.id!==ignoreLessonId&&x.coach===coachId&&x.status==='Onaylandı'&&x.date===ds&&plOverlap([x.hour*60,x.hour*60+60],[s,e]));
  if(p) return {type:'private',ref:p.id};
  return null;
}
function coachBusyReason(coachId,ds,h,ignoreId){
  const i=coachBusyInfo(coachId,ds,h*60,h*60+60,null,ignoreId);
  return i?i.type:null;
}

/* --- doğrulama: hatalar (alan) ve çakışmalar (kaynak) ayrı döner --- */
function validateGroup(c,ignoreId){
  const errors=[], conflicts=[];
  const name=String(c.name||'').trim();
  if(name.length<3||name.length>40) errors.push('Grup adı 3-40 karakter olmalı.');
  else if(!/^[\p{L}\p{N} .,\-()\/]+$/u.test(name)) errors.push('Grup adı yalnızca harf, rakam ve . , - ( ) / içerebilir.');
  else if(DB.groups.some(g=>g.id!==ignoreId&&g.name.trim().toLocaleLowerCase('tr')===name.toLocaleLowerCase('tr'))) errors.push('Bu adda bir grup zaten var.');
  if(GRP_LEVELS().indexOf(c.level)===-1) errors.push('Seviye seçin.');
  const amin=parseInt(c.ageMin,10);
  const amax=(c.ageMax===''||c.ageMax==null)?null:parseInt(c.ageMax,10);
  if(!(amin>=3&&amin<=80)) errors.push('Yaş alt sınırı 3 ile 80 arasında olmalı.');
  else if(amax!==null&&!(amax>=amin&&amax<=99)) errors.push('Yaş üst sınırı alt sınırdan küçük olamaz.');
  const cap=parseInt(c.capacity,10);
  const editing=ignoreId?DB.groups.find(x=>x.id===ignoreId):null;
  if(!(cap>=1&&cap<=60)) errors.push('Kontenjan 1 ile 60 arasında olmalı.');
  else if(editing&&cap<editing.enrolled) errors.push(`Kontenjan mevcut sporcu sayısından (${editing.enrolled}) az olamaz.`);
  const pool=DB.pools.find(p=>p.name===c.pool);
  if(!pool) errors.push('Havuz seçin.');
  let lanes=[];
  if(pool&&pool.lanes>0){
    lanes=(c.lanes||[]).map(Number).filter(n=>Number.isInteger(n));
    if(!lanes.length) errors.push('En az bir kulvar seçin.');
    else if(lanes.some(n=>n<1||n>pool.lanes)) errors.push(`${pool.name} için kulvar 1-${pool.lanes} arasında olmalı.`);
  }
  const days=(c.days||[]).filter(d=>GRP_DAYS.indexOf(d)>-1);
  if(!days.length) errors.push('En az bir gün seçin.');
  const s=timeToMin(c.start), e=timeToMin(c.end);
  if(s===null||e===null) errors.push('Başlangıç ve bitiş saatini girin.');
  else if(e<=s) errors.push('Bitiş saati başlangıçtan sonra olmalı.');
  else if(s<9*60||e>22*60) errors.push('Ders saatleri 09:00 - 22:00 arasında olmalı.');
  else if(e-s<30||e-s>180) errors.push('Ders süresi 30 ile 180 dakika arasında olmalı.');
  const coach=DB.coaches.find(x=>x.id===c.coach);
  if(!coach) errors.push('Antrenör seçin.');
  const asst=c.assistant?DB.coaches.find(x=>x.id===c.assistant):null;
  if(c.assistant&&!asst) errors.push('Yardımcı antrenör geçersiz.');
  else if(asst&&c.assistant===c.coach) errors.push('Yardımcı antrenör ana antrenörle aynı kişi olamaz.');
  const sd=c.startDate, ed=c.endDate||null;
  const okDate=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||'')&&ymd(parseYmd(x))===x;
  if(!okDate(sd)) errors.push('Başlangıç tarihini girin.');
  else if(!ignoreId&&sd<ymd(new Date())) errors.push('Başlangıç tarihi geçmişte olamaz.');
  else if(ed&&(!okDate(ed)||ed<sd)) errors.push('Bitiş tarihi başlangıç tarihinden önce olamaz.');
  else if(ed&&(parseYmd(ed)-parseYmd(sd))/86400000>730) errors.push('Grup süresi en fazla 2 yıl olabilir.');
  if(errors.length) return {errors,conflicts};

  const cand={id:ignoreId||'_new',coach:c.coach,assistant:c.assistant||null,day:days.join('/'),time:minToTime(s)+'-'+minToTime(e),startDate:sd,endDate:ed,pool:pool.name,lane:laneString(lanes)};
  /* A) Öğretmen (ve yardımcı): tarih aralığındaki her ders günü için coachBusyInfo */
  const people=[c.coach].concat(c.assistant?[c.assistant]:[]);
  const endScan=ed||(()=>{const t=parseYmd(sd);t.setDate(t.getDate()+364);return ymd(t);})();
  const seen={};
  for(const d=parseYmd(sd); ymd(d)<=endScan; d.setDate(d.getDate()+1)){
    const ds=ymd(d); if(!groupOnDay(cand,ds)) continue;
    people.forEach(pid=>{
      const info=coachBusyInfo(pid,ds,s,e,ignoreId||null,null);
      if(info){ const key=pid+'|'+info.type+'|'+info.ref; if(!seen[key]) seen[key]={pid,info}; }
    });
  }
  Object.keys(seen).forEach(k=>{
    const x=seen[k], who=coachName(x.pid);
    if(x.info.type==='group'){ const og=DB.groups.find(g=>g.id===x.info.ref); conflicts.push(`${who} bu saatte "${og.name}" grubunda görevli (${og.day} ${og.time}).`); }
    else { const pl=DB.privateLessons.find(p=>p.id===x.info.ref); conflicts.push(`${who} ${fmtDate(pl.date)} ${pl.hour}:00-${pl.hour+1}:00 saatinde onaylı özel derste (${athleteName(pl.athlete)}).`); }
  });
  /* B) Havuz / kulvar kapasitesi */
  const laneCap=pool.laneCapacity||1;
  const cd=groupDows(cand);
  const overl=DB.groups.filter(g=>g.id!==ignoreId&&g.pool===pool.name&&rangesOverlap(cand,g)&&Array.from(groupDows(g)).some(x=>cd.has(x))&&plOverlap(groupMinutes(g),[s,e]));
  if(pool.lanes>0){
    lanes.forEach(n=>{ const using=overl.filter(g=>laneList(g.lane).indexOf(n)>-1); if(using.length>=laneCap) conflicts.push(`${pool.name} ${n}. kulvar bu saatte "${using[0].name}" grubu tarafından kullanılıyor.`); });
  } else if(overl.length>=laneCap){
    conflicts.push(`${pool.name} bu saatte "${overl[0].name}" grubu tarafından kullanılıyor.`);
  }
  /* C) Düzenleme: mevcut sporcuların onaylı özel dersleri yeni saatle çakışmasın */
  if(ignoreId){
    DB.athletes.filter(a=>a.group===ignoreId).forEach(a=>{
      (DB.privateLessons||[]).filter(p=>p.athlete===a.id&&p.status==='Onaylandı'&&groupOnDay(cand,p.date)&&plOverlap([p.hour*60,p.hour*60+60],[s,e])).forEach(p=>conflicts.push(`${a.name} ${fmtDate(p.date)} ${p.hour}:00-${p.hour+1}:00 saatinde onaylı özel derste.`));
    });
  }
  /* D) Havuz kiralamaları */
  { const pk=poolPeak(pool,{kind:'group',days:cd,start:s,end:e,startDate:sd,endDate:ed,lanes},ignoreId||null);
    if(pk.over&&(pool.lanes>0||pk.clubs.length)) conflicts.push(pool.lanes>0?`Kiralamalar nedeniyle kulvar yetmiyor: ${minToTime(pk.at)} itibarıyla ${pk.peak}/${pk.cap} kulvar kullanılıyor${pk.clubs.length?' ('+pk.clubs.join(', ')+')':''}.`:`${pool.name} bu saatte kiralanmış (${pk.clubs.join(', ')}).`); }
  return {errors,conflicts};
}
function saveGroup(c,editId){
  if(!canManageGroups()) return {ok:false,errors:['Bu işlem için yetkiniz yok.'],conflicts:[]};
  const g=editId?DB.groups.find(x=>x.id===editId):null;
  if(editId&&!g) return {ok:false,errors:['Grup bulunamadı.'],conflicts:[]};
  const v=validateGroup(c,editId||null);
  if(v.errors.length||v.conflicts.length) return {ok:false,errors:v.errors,conflicts:v.conflicts};
  const pool=DB.pools.find(p=>p.name===c.pool);
  const lanes=pool.lanes>0?(c.lanes||[]).map(Number):[];
  const amin=parseInt(c.ageMin,10), amaxRaw=(c.ageMax===''||c.ageMax==null)?null:parseInt(c.ageMax,10);
  const days=GRP_DAYS.filter(d=>(c.days||[]).indexOf(d)>-1);
  const rec={name:String(c.name).trim(),level:c.level,age:amaxRaw===null?amin+'+':amin+'-'+amaxRaw,pool:pool.name,lane:laneString(lanes),day:days.join('/'),time:minToTime(timeToMin(c.start))+'-'+minToTime(timeToMin(c.end)),coach:c.coach,assistant:c.assistant||null,capacity:parseInt(c.capacity,10),startDate:c.startDate,endDate:c.endDate||null};
  let id;
  if(g){ Object.assign(g,rec); id=g.id; }
  else { id='g'+Date.now(); DB.groups.push(Object.assign({id,enrolled:0},rec)); }
  DB.coaches.forEach(co=>{co.groups=DB.groups.filter(x=>x.coach===co.id).map(x=>x.id);});
  save();
  return {ok:true,id,errors:[],conflicts:[]};
}

function grpOpen(editId,pre){

/* ============ SCHEDULE ============ */
/* ============ DERS PROGRAMI + ÖZEL DERS TALEPLERİ ============ */
const DAYTOKEN={Paz:0,Pzt:1,Sal:2,'Salı':2,'Çar':3,'Perş':4,Cum:5,Cmt:6};
const DAYNAMES=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const PL_FIRST=9, PL_LAST=20; // özel ders başlangıç saatleri: 09:00 - 20:00 (60 dk)
let schedWeek=0; let schedFilt={coach:'',pool:''}; let schedView='week', schedDayOff=0;
function schedSetView(v){
  if(v==='day'&&schedView!=='day') schedDayOff=schedWeek===0?0:7*schedWeek;
  schedView=v==='day'?'day':'week'; renderSchedule($('#content'));
}
function schedDayShift(n){ schedDayOff=Math.max(-28,Math.min(90,schedDayOff+n)); renderSchedule($('#content')); }
function schedDayToday(){ schedDayOff=0; renderSchedule($('#content')); }
function schedDayPick(v){ if(!/^\d{4}-\d{2}-\d{2}$/.test(v||'')) return; const t=new Date(); const base=new Date(t.getFullYear(),t.getMonth(),t.getDate()); const d=Math.round((parseYmd(v)-base)/864e5); schedDayOff=Math.max(-28,Math.min(90,d)); renderSchedule($('#content')); }
function schedSetFilt(k,v){ if(role!=='admin') return; schedFilt[k]=String(v||''); renderSchedule($('#content')); }
function schedClearFilt(){ schedFilt={coach:'',pool:''}; renderSchedule($('#content')); }
const plSel={coach:null,athlete:null,slots:[],note:''};
let plMsg='';

function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseYmd(s){const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function weekStart(offset){const n=new Date();const d=new Date(n.getFullYear(),n.getMonth(),n.getDate());d.setDate(d.getDate()-((d.getDay()+6)%7)+offset*7);return d;}
function groupMinutes(g){const f=t=>{const p=t.split(':').map(Number);return p[0]*60+p[1];};const a=g.time.split('-');return [f(a[0]),f(a[1])];}
function plOverlap(a,b){return a[0]<b[1]&&b[0]<a[1];}

/* --- çakışma kontrolü: öğretmen aynı saatte iki derse girmez --- */
function athleteBusyReason(athId,ds,h,ignoreId){
  const a=DB.athletes.find(x=>x.id===athId); if(!a) return 'unknown';
  const r=[h*60,h*60+60];
  const g=DB.groups.find(x=>x.id===a.group);
  if(g&&groupOnDay(g,ds)&&plOverlap(groupMinutes(g),r)) return 'group';
  if((DB.privateLessons||[]).some(p=>p.id!==ignoreId&&p.athlete===athId&&p.status==='Onaylandı'&&p.date===ds&&p.hour===h)) return 'private';
  return null;
}
function plSlotProblem(athId,coachId,ds,h){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(ds)||ymd(parseYmd(ds))!==ds||!Number.isInteger(h)||h<PL_FIRST||h>PL_LAST) return 'geçersiz gün veya saat';
  const when=parseYmd(ds); when.setHours(h,0,0,0);
  if(when<=new Date()) return 'geçmiş saat';
  if(coachBusyReason(coachId,ds,h)) return 'öğretmen bu saatte dolu';
  if(athleteBusyReason(athId,ds,h)) return 'bu saatte başka bir ders var';
  if((DB.privateLessons||[]).some(p=>p.athlete===athId&&p.coach===coachId&&p.date===ds&&p.hour===h&&p.status==='Onay bekliyor')) return 'bu saat için zaten talep var';
  return null;
}

/* --- işlemler --- */
function plRefresh(){ if(route==='schedule') renderSchedule($('#content')); }
function plRequest(athId,coachId,slots,note){
  if(!canRequestFor(athId)) return {created:0,msg:'Bu sporcu için talep oluşturamazsınız.'};
  if(!DB.coaches.some(c=>c.id===coachId)) return {created:0,msg:'Önce bir öğretmen seçin.'};
  if(!athletePackages(athId).length) return {created:0,msg:'Bu öğrenci için özel ders paketi tanımlı değil. 6, 8, 10 veya 20 saatlik paket için yönetici ile görüşün.'};
  if(!slots.length) return {created:0,msg:'En az bir gün ve saat işaretleyin.'};
  DB.privateLessons=DB.privateLessons||[];
  const skipped=[]; let created=0;
  slots.forEach(k=>{
    const parts=String(k).split('|'); const ds=parts[0]; const h=parseInt(parts[1],10);
    const bad=plSlotProblem(athId,coachId,ds,h);
    if(bad){ skipped.push(fmtDate(ds)+' '+h+':00 ('+bad+')'); return; }
    const pk=pickPackage(athId);
    if(!pk){ skipped.push(fmtDate(ds)+' '+h+':00 (paket saati kalmadı)'); return; }
    DB.privateLessons.push({id:'pl'+Date.now()+Math.floor(Math.random()*100000),pkg:pk.id,athlete:athId,coach:coachId,date:ds,hour:h,status:'Onay bekliyor',note:String(note||'').slice(0,200),createdAt:ymd(new Date()),requestedBy:role,decidedAt:null,decidedBy:null,reason:''});
    created++;
  });
  if(created) save();
  let msg=created?`${created} talep öğretmene gönderildi. Öğretmen onaylayınca takvimde görünecek.`:'';
  if(skipped.length) msg+=(msg?' ':'')+'Gönderilemeyenler: '+skipped.join('; ')+'.';
  return {created,msg};
}
function plApproveProblem(p){
  const when=parseYmd(p.date); when.setHours(p.hour,0,0,0);
  if(when<=new Date()) return 'saat geçmiş';
  if(coachBusyReason(p.coach,p.date,p.hour,p.id)) return 'öğretmen bu saatte artık dolu';
  if(athleteBusyReason(p.athlete,p.date,p.hour,p.id)) return 'öğrencinin bu saatte başka dersi var';
  return null;
}
function plDecide(id,status){
  const p=(DB.privateLessons||[]).find(x=>x.id===id);
  if(!p||p.status!=='Onay bekliyor'||!canDecidePL(p)) return;
  if(status==='Onaylandı'){
    const bad=plApproveProblem(p);
    if(bad){ plMsg='Onaylanamadı: '+bad+'.'; plRefresh(); return; }
    p.status='Onaylandı';
    (DB.privateLessons).forEach(o=>{ if(o.id!==p.id&&o.status==='Onay bekliyor'&&o.coach===p.coach&&o.date===p.date&&o.hour===p.hour){ o.status='Reddedildi'; o.reason='Bu saat başka bir ders için onaylandı'; o.decidedAt=ymd(new Date()); o.decidedBy='sistem'; } });
    plMsg='Özel ders onaylandı ve takvime eklendi.';
  } else if(status==='Reddedildi'){
    p.status='Reddedildi'; plMsg='Talep reddedildi.';
  } else return;
  p.decidedAt=ymd(new Date()); p.decidedBy=role==='admin'?'admin':DB.currentUser.coachId;
  save(); plRefresh();
}
function plCancel(id){
  const p=(DB.privateLessons||[]).find(x=>x.id===id);
  if(!p||!canCancelPL(p)) return;
  p.status='İptal'; p.decidedAt=ymd(new Date()); p.decidedBy=role==='admin'?'admin':role==='coach'?DB.currentUser.coachId:role;
  save(); closeDrawer(); plMsg='Özel ders iptal edildi, saat tekrar boşaldı.'; plRefresh();
}
function schedShift(n){schedWeek=Math.max(-4,Math.min(12,schedWeek+n)); renderSchedule($('#content'));}
function schedToday(){schedWeek=0; renderSchedule($('#content'));}
function plPickCoach(v){plSel.coach=v||null; plSel.slots=[]; renderSchedule($('#content'));}
function plPickAthlete(v){ if(!canRequestFor(v)) return; plSel.athlete=v; plSel.slots=[]; renderSchedule($('#content')); }
function plToggle(ds,h){ const k=ds+'|'+h; const i=plSel.slots.indexOf(k); if(i>-1) plSel.slots.splice(i,1); else plSel.slots.push(k); renderSchedule($('#content')); }

  const res=plRequest(cur.id,plSel.coach,plSel.slots.slice(),plSel.note);

function renderSchedule(c){
  const dayMode=schedView==='day';
  let dayDate=null;
  if(dayMode){ const t=new Date(); dayDate=new Date(t.getFullYear(),t.getMonth(),t.getDate()+schedDayOff); const mon=new Date(dayDate); mon.setDate(mon.getDate()-((mon.getDay()+6)%7)); schedWeek=Math.round((mon-weekStart(0))/(7*864e5)); }
  const ws=weekStart(schedWeek);
  const dates=Array.from({length:7},(_,i)=>{const d=new Date(ws);d.setDate(ws.getDate()+i);return d;});
  const hours=Array.from({length:13},(_,i)=>9+i); // 09:00-21:00
  const fam=(role==='parent'||role==='athlete');
  const isAdm=role==='admin';
  if(isAdm){ if(schedFilt.coach&&!DB.coaches.some(x=>x.id===schedFilt.coach)) schedFilt.coach=''; if(schedFilt.pool&&!DB.pools.some(x=>x.name===schedFilt.pool)) schedFilt.pool=''; }
  const fc=isAdm?schedFilt.coach:'', fp=isAdm?schedFilt.pool:'';

  const lab=p=>role==='coach'?escHtml(athleteName(p.athlete))
    :role==='athlete'?escHtml(coachName(p.coach))
    :role==='parent'?escHtml(athleteName(p.athlete).split(' ')[0])+' · '+escHtml(coachName(p.coach))
    :escHtml(athleteName(p.athlete))+' · '+escHtml(coachName(p.coach));
  let html=`<div class="cal"><div class="hcell">Saat</div>${dates.map((d,i)=>`<div class="hcell${ymd(d)===todayStr?' today':''}">${DAYNAMES[i]}<br><span style="font-weight:500;font-size:11px;">${d2(d)}</span></div>`).join('')}`;
  hours.forEach(h=>{
    html+=`<div class="tcell">${h}:00</div>`;
    dates.forEach(d=>{
      const ds=ymd(d);
      const evts=list.filter(g=>groupOnDay(g,ds)&&parseInt(g.time.split(':')[0],10)===h);
      const pls=priv.filter(p=>p.date===ds&&p.hour===h);
      html+=`<div class="slot">${evts.map(g=>`<div class="evt" onclick="showGroupMembers('${g.id}')">${g.name}<small>${g.time} · ${g.pool}${fam?'<br>'+visibleAthletes().filter(a=>a.group===g.id).map(a=>a.name.split(' ')[0]).join(', '):''}</small></div>`).join('')}${pls.map(p=>`<div class="evt private" onclick="plShow('${p.id}')">Özel ders<small>${h}:00-${h+1}:00 · ${lab(p)}</small></div>`).join('')}</div>`;
    });
  });
  html+='</div>';
  let navHtml=`<button class="btn sm" onclick="schedShift(-1)" aria-label="Önceki hafta">←</button><b>${d2(dates[0])} – ${d2(dates[6])} ${dates[6].getFullYear()}</b><button class="btn sm" onclick="schedShift(1)" aria-label="Sonraki hafta">→</button>${schedWeek!==0?'<button class="btn sm ghost" onclick="schedToday()">Bu hafta</button>':''}`;
  if(dayMode){
    const ds=ymd(dayDate), dIdx=(dayDate.getDay()+6)%7;
    const staffV=!fam;
    html='<div class="dv">'+hours.map(h=>{
      const ev=list.filter(g=>groupOnDay(g,ds)&&parseInt(g.time.split(':')[0],10)===h).sort((a,b)=>groupMinutes(a)[0]-groupMinutes(b)[0]);
      const pl=priv.filter(p=>p.date===ds&&p.hour===h);
      const cards=ev.map(g=>`<div class="evt" onclick="showGroupMembers('${g.id}')">${escHtml(g.name)}<small>${escHtml(g.time)} · ${escHtml(g.pool)}${g.lane&&g.lane!=='-'?' · '+escHtml(String(g.lane))+'. kulvar':''}${staffV?'<br>Antrenör: '+escHtml(coachName(g.coach))+(g.assistant?' (yrd: '+escHtml(coachName(g.assistant))+')':'')+' · '+(g.enrolled!=null?g.enrolled+'/'+g.capacity+' sporcu':''):'<br>'+visibleAthletes().filter(a=>a.group===g.id).map(a=>escHtml(a.name.split(' ')[0])).join(', ')}</small></div>`).join('')
        +pl.map(p=>`<div class="evt private" onclick="plShow('${p.id}')">Özel ders<small>${h}:00-${h+1}:00 · ${lab(p)}${staffV&&isAdm?' · '+escHtml(lessonPool(p)):''}</small></div>`).join('');
      return `<div class="dv-row"><div class="tcell">${h}:00</div><div class="dv-cell">${cards||'<span class="dv-empty">Ders yok</span>'}</div></div>`;
    }).join('')+'</div>';
    const total=list.filter(g=>groupOnDay(g,ds)).length+priv.filter(p=>p.date===ds).length;
    navHtml=`<button class="btn sm" onclick="schedDayShift(-1)" aria-label="Önceki gün">←</button><b>${DAYNAMES[dIdx]} ${d2(dayDate)}.${dayDate.getFullYear()}</b><button class="btn sm" onclick="schedDayShift(1)" aria-label="Sonraki gün">→</button>${schedDayOff!==0?'<button class="btn sm ghost" onclick="schedDayToday()">Bugün</button>':''}<input type="date" id="sd_pick" value="${ds}" onchange="schedDayPick(this.value)" aria-label="Tarih seç" style="padding:5px 8px;border:1px solid var(--line);border-radius:8px;"><span style="font-size:12px;color:var(--muted);">${total} ders</span>`;
  }
  navHtml+=`<span class="vtog" style="margin-left:auto;"><button class="${dayMode?'':'on'}" onclick="schedSetView('week')">Hafta</button><button class="${dayMode?'on':''}" onclick="schedSetView('day')">Gün</button></span>`;
  const msg=plMsg; plMsg='';
  c.innerHTML=`${msg?`<div class="note-banner">${escHtml(msg)}</div>`:''}
  <div class="weeknav">${navHtml}</div>
  ${isAdm?`<div class="card" style="padding:12px 14px;margin:10px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;">
    <div class="field" style="margin:0;min-width:180px;"><label for="sf_coach">Antrenör</label><select id="sf_coach" onchange="schedSetFilt('coach',this.value)"><option value="">Tüm antrenörler</option>${DB.coaches.map(x=>`<option value="${escHtml(x.id)}"${fc===x.id?' selected':''}>${escHtml(x.name)}</option>`).join('')}</select></div>
    <div class="field" style="margin:0;min-width:180px;"><label for="sf_pool">Havuz</label><select id="sf_pool" onchange="schedSetFilt('pool',this.value)"><option value="">Tüm havuzlar</option>${DB.pools.map(x=>`<option value="${escHtml(x.name)}"${fp===x.name?' selected':''}>${escHtml(x.name)}</option>`).join('')}</select></div>
    ${(fc||fp)?'<button class="btn sm ghost" onclick="schedClearFilt()">Filtreyi temizle</button>':''}
    <div style="font-size:12px;color:var(--muted);">${(fc||fp)?'Filtre açık: takvimde yalnızca seçilen antrenör/havuz dersleri görünür.':'Tüm dersler gösteriliyor.'}</div></div>`:''}
  <div style="overflow-x:auto;">${html}</div>
  ${fam?plFamHtml(dates):plStaffHtml()}
  <div class="note-banner" style="margin-top:18px;">${fam?'Bu takvimde yalnızca bağlı olduğunuz grupların gün, saat ve havuz bilgileri ile onaylanmış özel dersleriniz gösterilir.':'Gerçek sistemde grup dersleri sürükle-bırak ile taşınabilir; değişiklik olduğunda veli/sporcu/antrenöre otomatik bildirim gider. Bu prototipte grup programı salt-okunurdur. Özel dersler yalnızca öğretmen onayından sonra takvimde görünür ve o saate başka ders girilemez.'}</div>`;
}

/* ============ ANTRENMAN PROGRAMI (antrenör günlük antrenman yazar; veli/sporcu kendi grubunu okur) ============ */
const TP_PARTS=['Isınma','Teknik / drill','Ana set','Kondisyon','Soğuma','Diğer'];
const TP_FOCUS=['Teknik','Dayanıklılık','Sprint','IM','Koordinasyon','Suya güven','Nefes','Ayak çalışması','Süzülme','Diğer'];
let tpSel={group:'',date:'',draft:null,key:'',msg:'',err:'',confirmDel:false};
const tpId=(g,d)=>'tr_'+g+'_'+d;
const tpCanEdit=()=>role==='admin'||role==='coach';
const tpNum=v=>{ const s=String(v==null?'':v).trim(); if(s==='') return 0; return /^\d{1,6}$/.test(s)?parseInt(s,10):NaN; };
const tpBlankSets=()=>['Isınma','Teknik / drill','Ana set','Soğuma'].map(p=>({part:p,text:'',meters:''}));
function tpFind(g,d){ return (DB.trainings||[]).find(t=>t.group===g&&t.date===d)||null; }
function tpDateOk(d){ if(!/^\d{4}-\d{2}-\d{2}$/.test(String(d||''))) return false; const x=parseYmd(d); return ymd(x)===d&&x.getFullYear()>=2020&&x.getFullYear()<=2100; }
function tpValidate(inp){
  const errors=[];
  if(!tpCanEdit()) return {errors:['Antrenman programını yalnızca yönetici ve antrenör yazabilir.']};
  if(!inp||!canViewGroup(inp.group)) return {errors:['Bu grup için yetkiniz yok.']};
  if(!tpDateOk(inp.date)) errors.push('Geçerli bir tarih seçin.');
  if(TP_FOCUS.indexOf(inp.focus)<0) errors.push('Odak seçin.');
  const sets=Array.isArray(inp.sets)?inp.sets:[];
  if(sets.length<1||sets.length>12) errors.push('1 ile 12 arasında bölüm olmalı.');
  const out=[]; let total=0;
  sets.slice(0,12).forEach((s,i)=>{
    const part=TP_PARTS.indexOf(s.part)>-1?s.part:null, text=String(s.text==null?'':s.text).trim(), m=tpNum(s.meters);
    if(!part) errors.push((i+1)+'. bölüm türü geçersiz.');
    else if(text.length>200) errors.push((i+1)+'. bölüm açıklaması en fazla 200 karakter olabilir.');
    else if(isNaN(m)||m>20000) errors.push((i+1)+'. bölüm metresi 0 ile 20000 arasında bir sayı olmalı.');
    else if(text||m>0){ out.push({part,text,meters:m}); total+=m; }
  });
  if(!errors.length&&!out.length) errors.push('En az bir bölüme açıklama veya metre yazın.');
  if(total>30000) errors.push('Toplam metre 30000’i aşamaz.');
  const note=String(inp.note==null?'':inp.note).trim(); if(note.length>300) errors.push('Not en fazla 300 karakter olabilir.');
  if(errors.length) return {errors};
  return {errors:[],rec:{id:tpId(inp.group,inp.date),group:inp.group,date:inp.date,meters:total,focus:inp.focus,note,sets:out,by:role==='coach'?(DB.currentUser.coachId||''):'admin',updated:ymd(new Date())}};
}
function tpReadDom(){
  if(!tpCanEdit()||!tpSel.draft||!$('#tp_focus')) return;
  const d=tpSel.draft; d.focus=$('#tp_focus').value; d.note=($('#tp_note')||{}).value||'';
  d.sets=d.sets.map((s,i)=>({part:($('#tp_part_'+i)||{value:s.part}).value,text:($('#tp_text_'+i)||{value:s.text}).value,meters:($('#tp_m_'+i)||{value:s.meters}).value}));
}
function tpLoadDraft(){
  const key=tpSel.group+'|'+tpSel.date; if(tpSel.key===key&&tpSel.draft) return;
  const t=tpFind(tpSel.group,tpSel.date);
  tpSel.key=key; tpSel.confirmDel=false;
  if(t) tpSel.draft={focus:TP_FOCUS.indexOf(t.focus)>-1?t.focus:'Diğer',note:t.note||'',sets:(Array.isArray(t.sets)&&t.sets.length?t.sets.map(s=>({part:s.part,text:s.text,meters:String(s.meters||'')})):[{part:'Ana set',text:t.note||'',meters:String(t.meters||'')}]),exists:true};
  else tpSel.draft={focus:'Teknik',note:'',sets:tpBlankSets(),exists:false};
}
function tpPickGroup(v){ tpReadDom(); tpSel.group=v; tpSel.key=''; tpSel.msg=tpSel.err=''; renderTrainPlan($('#content')); }
function tpPickDate(v){ tpReadDom(); if(!tpDateOk(v)) return; tpSel.date=v; tpSel.key=''; tpSel.msg=tpSel.err=''; renderTrainPlan($('#content')); }
function tpLoad(ds){ tpPickDate(ds); }
function tpAddRow(){ tpReadDom(); if(!tpSel.draft||tpSel.draft.sets.length>=12) return; tpSel.draft.sets.push({part:'Diğer',text:'',meters:''}); renderTrainPlan($('#content')); }
function tpDelRow(i){ tpReadDom(); if(!tpSel.draft||tpSel.draft.sets.length<=1) return; tpSel.draft.sets.splice(i,1); renderTrainPlan($('#content')); }
function tpTotalLive(){ tpReadDom(); const t=(tpSel.draft?tpSel.draft.sets:[]).reduce((s,x)=>{const n=tpNum(x.meters);return s+(isNaN(n)?0:n);},0); const el=$('#tp_total'); if(el) el.textContent=t.toLocaleString('tr-TR')+' m'; }
function tpSave(){
  tpReadDom(); if(!tpSel.draft) return;
  const r=tpValidate({group:tpSel.group,date:tpSel.date,focus:tpSel.draft.focus,note:tpSel.draft.note,sets:tpSel.draft.sets});
  if(r.errors.length){ tpSel.err=r.errors.join(' '); tpSel.msg=''; renderTrainPlan($('#content')); return; }
  DB.trainings=DB.trainings||[];
  const i=DB.trainings.findIndex(t=>t.id===r.rec.id);
  if(i>-1) DB.trainings[i]=r.rec; else DB.trainings.push(r.rec);
  save(); tpSel.key=''; tpSel.err=''; tpSel.msg='Antrenman programı kaydedildi: '+groupName(r.rec.group)+' — '+fmtDate(r.rec.date)+'.'; renderTrainPlan($('#content'));
}
function tpDelete(){
  if(!tpCanEdit()||!canViewGroup(tpSel.group)) return;
  const t=tpFind(tpSel.group,tpSel.date); if(!t) return;
  if(!tpSel.confirmDel){ tpReadDom(); tpSel.confirmDel=true; renderTrainPlan($('#content')); return; }
  DB.trainings=DB.trainings.filter(x=>x.id!==t.id); save();
  tpSel.key=''; tpSel.confirmDel=false; tpSel.err=''; tpSel.msg='Antrenman programı silindi.'; renderTrainPlan($('#content'));
}
function tpCopy(){
  tpReadDom(); const to=($('#tp_copy_to')||{}).value||'';
  const t=tpFind(tpSel.group,tpSel.date);
  if(!t){ tpSel.err='Kopyalamak için önce programı kaydedin.'; tpSel.msg=''; renderTrainPlan($('#content')); return; }
  if(!tpDateOk(to)){ tpSel.err='Kopyalanacak tarihi seçin.'; tpSel.msg=''; renderTrainPlan($('#content')); return; }
  if(to===t.date){ tpSel.err='Aynı güne kopyalanamaz.'; tpSel.msg=''; renderTrainPlan($('#content')); return; }
  if(tpFind(tpSel.group,to)){ tpSel.err=fmtDate(to)+' tarihinde zaten bir program var. Üzerine yazılmaz.'; tpSel.msg=''; renderTrainPlan($('#content')); return; }
  const r=tpValidate({group:t.group,date:to,focus:t.focus,note:t.note,sets:t.sets||[{part:'Ana set',text:t.note||'',meters:t.meters}]});
  if(r.errors.length){ tpSel.err=r.errors.join(' '); tpSel.msg=''; renderTrainPlan($('#content')); return; }
  DB.trainings.push(r.rec); save();
  tpSel.err=''; tpSel.msg='Program '+fmtDate(to)+' tarihine kopyalandı.'; renderTrainPlan($('#content'));
}
function tpSetsHtml(t){
  const sets=Array.isArray(t.sets)&&t.sets.length?t.sets:(t.note?[{part:'Not',text:t.note,meters:t.meters}]:[]);
  return sets.length?`<table style="margin-top:6px;"><tbody>${sets.map(s=>`<tr><td style="width:130px;"><b>${escHtml(s.part)}</b></td><td>${escHtml(s.text)}</td><td class="n" style="white-space:nowrap;">${s.meters?Number(s.meters).toLocaleString('tr-TR')+' m':''}</td></tr>`).join('')}</tbody></table>`:'';
}
function tpCardHtml(t,clickable){
  return `<div class="card" style="margin-bottom:10px;${clickable?'cursor:pointer;':''}"${clickable?` onclick="tpLoad('${escHtml(t.date)}')"`:''}>
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;"><b>${escHtml(fmtDate(t.date))} · ${escHtml(t.focus||'')}</b><span style="color:var(--muted);">${Number(t.meters||0).toLocaleString('tr-TR')} m</span></div>
    ${tpSetsHtml(t)}${t.note&&Array.isArray(t.sets)&&t.sets.length?`<div style="font-size:12.5px;color:var(--muted);margin-top:6px;">Not: ${escHtml(t.note)}</div>`:''}</div>`;
}
function renderTrainPlan(c){
  const groups=visibleGroups();
  const edit=tpCanEdit();
  if(!groups.length){ c.innerHTML='<div class="card"><div class="empty">Görüntülenecek grup yok.</div></div>'; return; }
  if(!groups.some(g=>g.id===tpSel.group)){ tpSel.group=groups[0].id; tpSel.key=''; }
  if(!tpDateOk(tpSel.date)){ tpSel.date=ymd(new Date()); tpSel.key=''; }
  const msg=tpSel.msg, err=tpSel.err; tpSel.msg=''; tpSel.err='';
  const hist=(DB.trainings||[]).filter(t=>t.group===tpSel.group).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  let html=`${msg?`<div class="note-banner">${escHtml(msg)}</div>`:''}${err?`<div class="grp-result bad" role="alert">${escHtml(err)}</div>`:''}
  <div class="card" style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;">
    ${groups.length>1||edit?`<div class="field" style="margin:0;min-width:220px;"><label for="tp_group">Grup</label><select id="tp_group" onchange="tpPickGroup(this.value)">${groups.map(g=>`<option value="${escHtml(g.id)}"${g.id===tpSel.group?' selected':''}>${escHtml(g.name)} · ${escHtml(g.day)} ${escHtml(g.time)}</option>`).join('')}</select></div>`:`<div><b>${escHtml(groupName(tpSel.group))}</b></div>`}
    ${edit?`<div class="field" style="margin:0;"><label for="tp_date">Tarih</label><input type="date" id="tp_date" value="${escHtml(tpSel.date)}" onchange="tpPickDate(this.value)"></div>`:''}
  </div>`;
  if(edit){
    tpLoadDraft(); const d=tpSel.draft; const total=d.sets.reduce((s,x)=>{const n=tpNum(x.meters);return s+(isNaN(n)?0:n);},0);
    html+=`<div class="card"><b>${escHtml(fmtDate(tpSel.date))} antrenman programı${d.exists?'':' (yeni)'}</b>
    <div class="field" style="margin-top:10px;max-width:260px;"><label for="tp_focus">Odak</label><select id="tp_focus">${TP_FOCUS.map(f=>`<option${d.focus===f?' selected':''}>${escHtml(f)}</option>`).join('')}</select></div>
    <div style="display:grid;gap:8px;">${d.sets.map((s,i)=>`<div class="tp-row" style="display:grid;grid-template-columns:150px 1fr 110px 36px;gap:8px;align-items:center;">
      <select id="tp_part_${i}" aria-label="Bölüm">${TP_PARTS.map(p=>`<option${s.part===p?' selected':''}>${escHtml(p)}</option>`).join('')}</select>
      <input id="tp_text_${i}" maxlength="200" value="${escHtml(s.text)}" placeholder="Örn. 4x200 karışık, 20 sn dinlenme" aria-label="Açıklama">
      <input id="tp_m_${i}" inputmode="numeric" maxlength="6" value="${escHtml(s.meters)}" placeholder="metre" oninput="tpTotalLive()" aria-label="Metre">
      <button class="btn sm ghost" onclick="tpDelRow(${i})" aria-label="Bölümü sil"${d.sets.length<=1?' disabled':''}>✕</button></div>`).join('')}</div>
    <div style="display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap;"><button class="btn sm" onclick="tpAddRow()"${d.sets.length>=12?' disabled':''}>+ Bölüm ekle</button><span style="color:var(--muted);">Toplam: <b id="tp_total">${total.toLocaleString('tr-TR')} m</b></span></div>
    <div class="field"><label for="tp_note">Not (isteğe bağlı)</label><textarea id="tp_note" maxlength="300" rows="2">${escHtml(d.note)}</textarea></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
      <button class="btn primary" onclick="tpSave()">Kaydet</button>
      ${d.exists?`<button class="btn" onclick="tpDelete()" style="${tpSel.confirmDel?'background:var(--red);color:#fff;':''}">${tpSel.confirmDel?'Silmek için tekrar basın':'Sil'}</button>
      <div class="field" style="margin:0 0 0 auto;"><label for="tp_copy_to">Başka güne kopyala</label><div style="display:flex;gap:6px;"><input type="date" id="tp_copy_to"><button class="btn" onclick="tpCopy()">Kopyala</button></div></div>`:''}
    </div></div>`;
  } else {
    html+=hist.length?'':'<div class="card"><div class="empty">Bu grup için henüz antrenman programı girilmemiş.</div></div>';
  }
  html+=`<div class="section-title">${edit?'Bu grubun geçmiş programları':'Antrenman programları'}</div>`;
  html+=hist.length?hist.slice(0,edit?20:15).map(t=>tpCardHtml(t,edit)).join(''):(edit?'<div class="card"><div class="empty">Henüz kayıtlı program yok.</div></div>':'');
  c.innerHTML=html;
}

/* ============ ATTENDANCE ============ */
function renderAttendance(c){
  let list=DB.groups;
  list=visibleGroups();
  const today=new Date().toISOString().slice(0,10);
  c.innerHTML=`
  <div class="card">
  <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px;">
    <div class="field" style="min-width:220px;margin-bottom:0;"><label>Grup</label>
      <select id="attGroup">${list.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}</select></div>
    <div class="field" style="margin-bottom:0;"><label>Tarih</label><input type="date" id="attDate" value="${today}"></div>
    <button class="btn primary" onclick="saveAttendance()">Yoklamayı Kaydet</button>
  </div>
  <div id="attGridWrap"></div>
  </div>`;
  function drawGrid(){
    const gid=$('#attGroup').value, date=$('#attDate').value;
    const members=DB.athletes.filter(a=>a.group===gid);
    const key=gid+'|'+date;
    const saved=DB.attendanceLog[key]||{};
    const opts=['Katıldı','Gelmedi','Geç geldi','İzinli','Hastalık','Telafi'];
    $('#attGridWrap').innerHTML=`<div class="attn-grid">${members.map(m=>`
      <div class="attn-item">${av('athlete:'+m.id,m.name,'width:26px;height:26px;font-size:10.5px;')}${m.name}
      <select data-a="${m.id}">${opts.map(o=>`<option ${saved[m.id]===o||(!saved[m.id]&&o==='Katıldı')?'selected':''}>${o}</option>`).join('')}</select></div>`).join('')||'<div class="empty">Bu grupta sporcu yok</div>'}</div>`;
  }
  $('#attGroup').onchange=drawGrid; $('#attDate').onchange=drawGrid; drawGrid();
}
function saveAttendance(){
  const gid=$('#attGroup').value, date=$('#attDate').value;
  if(!(role==='admin'||role==='coach')||!canViewGroup(gid)) return;

  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});

const PHOTO_RE=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/;
const PHOTO_MAX=150000;
function myPhotoKey(){
  const u=DB.currentUser;
  if(role==='admin') return 'admin';

function photoKeyAllowed(key){

  }

}
function canSeePhoto(key){
  if(typeof key!=='string') return false;
  if(key==='admin'||key.startsWith('coach:')) return true;
  if(key.startsWith('athlete:')) return canViewAthlete(key.slice(8));

}
function setPhoto(key,url){
  if(!photoKeyAllowed(key)) return {ok:false,msg:'Bu fotoğrafı değiştirme yetkiniz yok.'};
  if(url!==null&&(typeof url!=='string'||url.length>PHOTO_MAX||!PHOTO_RE.test(url))) return {ok:false,msg:'Geçersiz fotoğraf.'};

function photoPick(key,inp){
  const f=inp.files&&inp.files[0]; const msg=document.getElementById('photoMsg');
  const say=t=>{if(msg){msg.textContent=t;msg.style.color='var(--red)';}};
  if(!f) return;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)) return say('Yalnızca JPG, PNG veya WebP yükleyin.');
  if(f.size>5*1024*1024) return say('Dosya 5 MB’dan büyük olamaz.');
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();
    im.onload=()=>{try{const S=256,cv=document.createElement('canvas');cv.width=cv.height=S;const m=Math.min(im.width,im.height);
      cv.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);
      const r=setPhoto(key,cv.toDataURL('image/jpeg',0.82)); if(!r.ok) return say(r.msg); render();}catch(e){say('Fotoğraf işlenemedi.');}};
    im.onerror=()=>say('Görsel okunamadı.'); im.src=rd.result;};
  rd.onerror=()=>say('Dosya okunamadı.'); rd.readAsDataURL(f);
}

/* ---------- ANTRENÖR YÖNETİMİ ---------- */
function validateCoach(c,ignoreId){
  const e=[]; const name=String(c.name||'').trim(), phone=String(c.phone||'').trim(), sp=String(c.specialty||'').trim();
  if(!/^[\p{L} .'\-]{3,40}$/u.test(name)) e.push('Ad soyad 3-40 karakter olmalı ve yalnızca harf içermeli.');
  else if(DB.coaches.some(x=>x.id!==ignoreId&&x.name.toLocaleLowerCase('tr')===name.toLocaleLowerCase('tr'))) e.push('Bu adda bir antrenör zaten var.');
  if(!/^[0-9 +()\-]{10,20}$/.test(phone)) e.push('Geçerli bir telefon numarası girin.');
  if(sp.length>60||!/^[\p{L}\p{N} .,\-\/()]*$/u.test(sp)) e.push('Uzmanlık alanı en çok 60 karakter olmalı ve özel karakter içermemeli.');
  return e;
}
function saveCoach(c,editId){
  if(!canManageCoaches()) return {ok:false,errors:['Bu işlem için yetkiniz yok.']};
  const co=editId?DB.coaches.find(x=>x.id===editId):null;
  if(editId&&!co) return {ok:false,errors:['Antrenör bulunamadı.']};
  const e=validateCoach(c,editId||null); if(e.length) return {ok:false,errors:e};
  const rec={name:c.name.trim(),phone:c.phone.trim(),specialty:String(c.specialty||'').trim()||'Genel'};
  let id;
  if(co){Object.assign(co,rec); id=co.id;}
  else {id='c'+Date.now(); DB.coaches.push(Object.assign({id,groups:[]},rec));}
  save(); return {ok:true,id,errors:[]};
}
function removeCoach(id){
  if(!canManageCoaches()) return {ok:false,msg:'Bu işlem için yetkiniz yok.'};
  const co=DB.coaches.find(x=>x.id===id); if(!co) return {ok:false,msg:'Antrenör bulunamadı.'};
  if(DB.coaches.length<=1) return {ok:false,msg:'Son antrenör silinemez.'};
  const gs=DB.groups.filter(g=>g.coach===id||g.assistant===id);
  if(gs.length) return {ok:false,msg:`${co.name} ${gs.length} grupta görevli. Önce grupları başka antrenöre devredin.`};
  if(DB.athletes.some(a=>a.coach===id)) return {ok:false,msg:`${co.name} adına kayıtlı sporcular var. Önce sporcuları taşıyın.`};
  const pl=(DB.privateLessons||[]).filter(p=>p.coach===id&&(p.status==='Onaylandı'||p.status==='Onay bekliyor')&&p.date>=todayStr());
  if(pl.length) return {ok:false,msg:`${co.name} için ${pl.length} aktif özel ders kaydı var. Önce iptal edin.`};
  DB.coaches=DB.coaches.filter(x=>x.id!==id);
  if(DB.photos) delete DB.photos['coach:'+id];
  if(DB.currentUser.coachId===id) DB.currentUser.coachId=DB.coaches[0].id;
  save(); return {ok:true,msg:`${co.name} silindi.`};
}
function groupToCfg(g){
  const pa=parseAge(g.age), tm=g.time.split('-');
  return {name:g.name,level:g.level,ageMin:pa.min,ageMax:pa.max,capacity:g.capacity,pool:g.pool,lanes:laneList(g.lane),
    days:GRP_DAYS.filter(d=>g.day.split('/').some(k=>DAYTOKEN[k.trim()]===DAYTOKEN[d])),start:tm[0],end:tm[1],coach:g.coach,assistant:g.assistant||'',
    startDate:g.startDate||todayStr(),endDate:g.endDate||null};
}
function assignCoachGroups(coachId,ids,replId,dry){
  if(!canManageCoaches()) return {ok:false,errors:['Bu işlem için yetkiniz yok.'],conflicts:[]};
  const co=DB.coaches.find(x=>x.id===coachId); if(!co) return {ok:false,errors:['Antrenör bulunamadı.'],conflicts:[]};
  ids=Array.from(new Set(ids||[])).filter(i=>DB.groups.some(g=>g.id===i));
  const cur=DB.groups.filter(g=>g.coach===coachId).map(g=>g.id);
  const added=ids.filter(i=>cur.indexOf(i)<0), removed=cur.filter(i=>ids.indexOf(i)<0);
  const errors=[],conflicts=[];
  if(removed.length){
    if(!replId||replId===coachId||!DB.coaches.some(x=>x.id===replId)) errors.push('Çıkarılan gruplar için devralacak başka bir antrenör seçin.');
  }
  if(errors.length) return {ok:false,errors,conflicts};
  const snap={}; const changes=added.map(i=>[i,coachId]).concat(removed.map(i=>[i,replId]));
  changes.forEach(([gid,to])=>{const g=DB.groups.find(x=>x.id===gid); snap[gid]=g.coach; g.coach=to;});
  changes.forEach(([gid])=>{
    const g=DB.groups.find(x=>x.id===gid);
    const v=validateGroup(groupToCfg(g),gid);
    v.errors.concat(v.conflicts).forEach(m=>conflicts.push(`${g.name}: ${m}`));
  });
  if(conflicts.length||dry||!changes.length){
    Object.keys(snap).forEach(gid=>{DB.groups.find(x=>x.id===gid).coach=snap[gid];});
    return {ok:!conflicts.length&&!dry,errors,conflicts,changed:changes.length};
  }
  changes.forEach(([gid,to])=>{DB.athletes.filter(a=>a.group===gid).forEach(a=>{a.coach=to;});});
  DB.coaches.forEach(x=>{x.groups=DB.groups.filter(g=>g.coach===x.id).map(g=>g.id);});
  save();
  return {ok:true,errors,conflicts,changed:changes.length};
}
